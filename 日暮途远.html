我无法说明我的真正意图，因为我感觉得到我和她的距离，她就像极为美丽的烟火，凑近之后只会被灼烧。", "退却是我这名失败者擅长的温柔，至少对于自己来说。", "“请，不要，再提，这件事。我会，信守，自己的，承诺的。”", "然后她走出了厨房，把碗端了过来，在我看来颇有一种“大郎，喝药了。”的味道。", "“味增汤，为你，做的。”她如是说道，让人有种真的把汤喝下的冲动。", "她是值得被这样对待的，但是我是没有资格这样对待的。", "“你这个汤咸过头了，而且按照你把锅烧糊了这件事来推理，你肯定是水放少了对吧。”", "“没有啊。”她掏出她的手机认认真真地看起来，“是三杯啊。”", "她说着把手机屏幕拿给我看。", "我内心诅咒着那个不靠谱的写菜谱的家伙，对洛灵梦说道：“你用的什么杯子啊？”", "她指了指旁边那个差不多一百五十毫升的杯子，我看了一眼那杯子，然后转过头来盯着光是鲷骨就有三百克的菜谱出神。", "“你昨天为什么会把自己做的汤倒掉啊？”", "“太咸了，吃不了。”", "“那你还拿给我吃啊！”", "“万一，今天，它，自己，就好了呢？”她歪着头对我说道。", "……", "还好今天洛灵梦做完的早，否则估计时间估计又会来不及。", "我从初中开始就保留着一个习惯，喜欢观察周围有没有家里办过卡的店面，昨天就在吗M中附近看到了一家面包店连锁店我家是有储值卡的。", "于是就把今早的早餐定在了那里。", "一进店，店里小妹就被我的帅气所迷住了，目不转睛地盯着我看，当然，我是不太会理会这种目光的。", "我开始用夹子去夹那些面包，喂！我已经开始夹面包了，没必要再盯着门口看了。", "哦，你是在看洛灵梦啊，那没事儿了。", "“香。”洛灵梦一边念叨着，一边向我走来，然后盯着我盘子里的盐烧芝士。", "“还没买，你这家话别先把这东西吃掉了！”我一边抱怨着洛灵梦的馋嘴，一边迅速地又夹了几个面包，然后几个跨步跑到门口。", "洛灵梦则是缓慢地跟在我的后面吗，眼神一直盯着我的脸看着，让我即使在结账时报老爸电话号码的时候都有点发毛。", "“你干嘛老师看我啊，别告诉我你喜……算了。”", "“好吃的，不给我，可恶。”", "“都说了，等我买我再说这些是啊。”", "“好吃的，不给我，可恶。”", "我干脆放弃理会洛灵梦，顶着销售员奇怪的眼光，把会员卡密码输了，赶紧跑路。", "当然，我是不会拉起洛灵梦的手的，我也不敢。", "“喏。”我递给跟上来的洛灵梦那根她之前就憧憬已久的盐烧芝士。", "不过她的目光始终没有放过我，特别是我手里提着的那两个面包中的巧克力爆浆包。", "我把她忽悠进了她的教室，原话说的是：“你先吃着这个盐烧芝士，我帮你把巧克力爆浆包留到下课，下课你来找我。”", "当然，她在下节课下课那短短的八分钟能不能找到我在哪个教室就说不准了，毕竟我只帮她保留一节课。", "我的大脑保护了我的胃。"]}, {"title": "第九章 失败者理论", "body": ["“看看你们那副样子，这开学才第二天就睡下一大片，你们晚上干了什么只有自己知道。别觉得自己初三努力高一就松懈，年轻的时候不奋斗等老了再奋斗吗？”毫无疑问，这只会是我们班主任对我们的训斥。", "我仍旧顶着那副自以为是的死鱼眼，对于老师对训诫麻木不仁。", "第一节课是语文课，至少现阶段来讲，我们的第一节课还没有彻底变成补觉课，教室的后排也不会占一排人。", "我们的语文老师是一名中年女性，其声音和语调的催眠程度在我看来相当强，估计要不是这才开学第二天，我们班估计得趴下一半。", "……", "大致是因为这是第二届语文课的原因，老师并没有进行拖堂，不过我才刚刚趴下，就被一个女声叫醒了。", "“请问，你是零绮一同学吗？”我两只手放在桌子上，抬起头。", "是一个留着齐肩短发的女生，长得算是清秀。", "“啊，是我，有什么事情吗？”我心想根本不认识这个女生，这样想来她应该不认识我，那能从我那一点也不出彩的自我介绍中记住我也算是挺厉害的。", "“门口有人找你。”她指了指门口。", "“哦，好的。”心说难道洛灵梦真这么准就找到了我，拿着巧克力爆浆包走了出去。", "看到洛灵梦站在门的旁边，站在她一侧的还有另一位留着长发的女生。", "如果把上半身的身材比作函数的话，那洛灵梦的人生必然是y=a。", "至于现在站在她身侧的女生，则是一个峰顶极高的二次函数。", "“零，绮一，好吃的，给我。”洛灵梦向我伸出了手。", "我无奈地叹了口气，巧克力爆浆包，我最终还是没有保护好你，走好。", "洛灵梦从我手中接过面包，退到一边，小口小口地啃了起来。", "“请问，你是洛灵梦同学的亲戚吗？”那位身材傲人的女生走了过来。", "“哦，不是。”", "我心中咯噔一下，知道估计碰到正义人士了，真是麻烦。", "“那请问为什么洛灵梦同学会来找你要面包呢？”她提出了疑问。", "“她来不来找我要吃的，都跟你没什么太大关系吧，你是她的监护人吗？”我盯着那副死鱼眼，语气毫无波澜的回答道。", "“我只是不希望我觉得完美的东西被玷污而已。”她有些正义凌然的说道。", "“那你的愿望跟我有什么关系，你当我是阿拉丁神灯啊？”", "“可你正在破坏她的美好，洛灵梦同学的成绩即使是在M市也是最顶尖的，跟你这样的人有过多的交流会影响她。”", "“你是她的同学？”", "“是的。”", "“我怀疑你是有特殊方式进的A1吧，就你这种大脑能凭自己考上A1？”", "“你什么意思！”", "“是我在影响洛灵梦？少扯淡了，分明是你在用你那自以为是的要求随意的对她的行为指手画脚，你无法去直接改变她。就试图欺软怕硬地来对我进行施压，我觉得你的脑袋一定是受到了什么冲撞，不然怎么会有这样神奇的脑回路。毕竟你都觉得她是完美的了，那她做得决定你还想去干涉？你也不问问自己的内心，你配吗？”", "她有点急眼：“我怎么知道你是不是用什么卑劣的手段欺骗了洛灵梦同学。”", "“拜托，你都觉得她是完美的了，为什么还会被我这种家伙骗啊。”", "“因为洛灵梦同学心地善良啊。”", "“那你为什么要破坏她的善良呢，甚至她的善良还没有出现，你就试图要把它掐断了。”", "“因为对你这样的人善良，会让洛灵梦同学受到伤害。”", "“但是你让她甚至不能自己做出选择，更会让她受到伤害。而且你的论点一直都站在你一厢情愿的幻想中，你没有任何资格保护洛灵梦，你更保护不了，假设要伤害她的人不是我，而是强大的多的人，你又该作何选择呢？就算你主观意愿再想保护她，你又能如何呢？”", "“所以，到时候，你的保护只会让洛灵梦形成依赖，而这种依赖削去了她自保的能力，她一无所获，你却收获了你保护洛灵梦的卑劣愿望。你只是在以你那所谓的保护之名，强加给洛灵梦你的欲望而已。真正伤害了洛灵梦的人不是我，而是你。”", "“你这是诡辩！而且你没有任何论据可以证明我无法保护洛灵梦同学。”", "“哦，太巧了，你也没有任何证据证明洛灵梦跟我呆在一起就会产生不良影响，我仅仅是在怀疑你的能力，而你是在怀疑我的人格。至少按照普世的价值观来看，你这种行为更应该被谴责。”", "当然，这样的争论必然是会吸引周围人的目光的，包括之前嘲笑我的名为张东超的人。", "不过我是无所谓的，作为一个实打实失败者，大不了跟这个我最讨厌的成功并且正义的人士进行一波极限一换一。", "我血赚，她血亏。", "“对了，洛灵梦，你怎么觉得？”", "洛灵梦听到我叫她，抬起吃着面包的头，嘴角残留着爆浆留下的黑色汁水，显得一副呆呆傻傻的模样：“我？觉得，什么？”", "“简单概括就是你这位同学的意思就是我跟你呆在一起会影响你完美的人生，让我速速离开。”", "“是，这样，吗？”", "那位正义同学满头黑线，眼神里写着的都是不满，但还是点头承认下来。", "“那样的话，是不行的，我答应了，零，绮一，每天，早上，要为他，做味增汤。”", "拜托你别这样说了，真的会对我造成了很大困扰的。", "正义同学闻言刚要化身恶魔直接把我干碎，但是这时候铃声响了。", "她狠狠地瞪了我一眼，一把拉过又开始在小口小口啃着剩下的巧克力爆浆包的洛灵梦离开了我们教室门口的走廊。", "离开时，洛灵梦对着我挥手说道：“零，绮一，你，还有，好吃的，吧。”", "“没有了。”我耸耸肩对洛灵梦说道，即使我知道学校的小卖部估计也有零食。", "失败者应有失败者的模样，不去过多的接触成功者，以好好地保护自己和他人，但同时也不应该向成功者让步亦或是奴颜媚骨，因为这种行为本就拉近了距离，同时还丧失了一个失败者该有的一切都不成功的本质。", "就像我一样。", "“哟，零大哥是不一样啊，第二天就爆杀A1的女同学，堪称吾辈楷模啊。”那位仁兄阴阳怪气的声音又传来了。", "真烦人啊，我趴倒在我的桌子上。"]}, {"title": "第十章 屈人之威！", "body": ["“啊，正义人，你怎么又跑到这儿来了啊？不怕沾染到我们这些下流人事的气味污染你所谓的完美吗？”我盯着一副死鱼眼看着跟在洛灵梦身后的正义人同学。", "“正因如此，我才有必要跟来保护洛灵梦同学，还有，请不要叫我正义人，我有名字……”", "“懂的，楚雨荨嘛。”", "她的嘴角开始抽动，估计并没有理解我所说的梗。", "“你这家伙，不要随便歪曲别人的名字啊。”", "我回头砍了她一眼，一副恼羞成怒的样子让我非常舒爽，直呼舒服了，然后回答了她的要求：“你的要求，我听到了。你很迫切的需要，但是，我拒绝。”", "闻言，她急眼了，暴跳如雷。", "我则一脸无所谓的对着洛灵梦说了声：“走咯。”", "洛灵梦乖乖跟上，问道：“会，有，好吃的，吗？”", "我回忆了下昨天的饭菜，勉强还说得过去，于是回答说：“应该算是有吧，看你的定义了。”", "“好。”洛灵梦惜字如金。", "“喂！”", "“第一，我这不是拽，是愤怒，第二，我不叫喂，我叫楚雨荨！”", "“零，绮一，你，改名字，了？”洛灵梦歪了歪头，盯着我说。", "“对啊，你改名了，早上还听洛灵梦同学叫你零绮一来着。”", "“哦，原来你知道我的名字啊，那你干啥还亲切地叫我这家伙呢？我仅仅只是在不知道你的名字的情况下，以我对你的特征进行评判给的称号，况且正义这个修饰词还是一个褒义词，哪怕是在这种情况下，因为我对你的话头产生了因影视剧中的条件反射，你就开始对我以【这家伙】相称，看到你这种情况的尖子生，我真的有种感觉——我国的素质教育还有很长一段路要走。”", "说完这段话，我倒是爽了，但是字字句句都能打在这位正义人同学的痛处上，让她真正的急眼了。", "我估摸着还差一点她就可以对我发动进攻了，于是用手肘戳了戳洛灵梦的手臂：“洛灵梦，这个正义人到底叫什么名字啊。”", "“好像，叫，夏露可？”洛灵梦用食指放在下巴处想了想说道。", "“哦？还蛮洋气的嘛，不过我还是更喜欢中式与古朴简单的名字，还是叫她正义人好了。”", "“喂，请你至少对人尊重一些好吗？”正义人同学如我意料中的向我冲来，但是我好像高估了她的身体协调性，也许是因为胸前有些突出于其他部位以导致重心向前，她没有在本该停下的时候停下。", "而是在我面前向着我扑到而来。", "哦，原来是传说中的幸运色狼情节，不过如果在这里把我的第一次被女孩扑到交给这位正义人同学就实在有些不值得了。", "——如果一个男性没有被女孩扑倒，那他就有可能被很不可爱的女孩子扑倒，也有可能被很可爱的女孩子扑倒，而在没有被扑倒之前，他介于二者之间，这就是有名的“薛定谔的被扑倒”。", "而作为一名有自知的失败者，我知道这辈子大概是不太可能被可爱的女孩子扑倒的，但是如果要让我把第一次体验交给这位的手上那还是算了吧。", "我宁愿抱着我的薛定谔的被扑倒过一辈子。", "在她跑过来之前，我自然是已经转过身来，我眼疾手快地把自己一手抓着提带的双肩包挡在了我的身前。", "下盘稳住，正义人同学的胸部首先接触到我的双肩包，随后就是一阵强大的冲击力。", "然后正义人同学的头就奔着我的头而来了，我即兴地把头往后甩了一下，然后向前甩回。", "屈人之威头槌版！", "正义人同学吃疼，向后方一屁股坐了下去，捂住了头部，就差没在地上打个滚了。", "“零，绮一，你，为什么，要撞，夏露可，同学，啊？”洛灵梦歪着头看着躺在地上缩成一团的正义人同学，“她，好像，很疼，的样子。”", "尽管我相信自己的颅骨应该要比正义人的坚硬，血管应该也是会坚强一些的，但是我的神经末梢并不这么想，疯狂的给我的大脑传递着痛觉。", "不过为了让我这个B装的彻底一些，我再次拉着提带把双肩包放在了身后，望着天说了一声：“为了世界和平。”", "“为了，世界和平？”洛灵梦歪着头看着我说。", "然后向着我踏了两步，踮起脚尖，用额头轻轻撞上了我的额头。", "然后退了回去，悄悄地站在我的旁边弯着腰问道：“世界，和平，了吗？”", "世界有没有和平我不知道，反正我估计是要死掉了。", "“喂，你在骗洛灵梦同学做什么事啊，混蛋！”", "果然额头还是会因为这次再度撞击而感觉到疼痛啊，我已经感觉到血液在额头处瘀结，估计是要肿了。", "……", "却说，我们一行人来到了学校的食堂，而正义人同学还在试图告诉洛灵梦我在说谎：“他做的那些事情怎么可能是为了世界和平？这二者根本没有关系，洛灵梦同学你可不要随便被他骗了啊，这种人满嘴跑火车的。”", "洛灵梦看了看我：“零绮一，你在说谎吗？”", "我对着食堂打饭的大妈说道：“两份干锅烧菜，谢谢。”", "然后转身对洛灵梦说道：“没有哦，这两者之间其实是有联系的，毕竟如果我当时没有用力撞开正义人同学的话，她的面部会给我来一个亲密的接触，这样会导致我和她的心情都相当不美丽。顺带的，如果是按照恋爱轻喜剧的发展的话，这可能会成为我们之间发展恋情的一步，但我认为我一定与她性情不和，也就是说如果恋爱后多半会陷入不断地争吵中，降低民众的幸福率，一定程度上还有可能提高国家的自杀率以导致人心不稳，尽管只是一个小小的可能性和一个偏差值。但是就像亚马逊丛林的一只蝴蝶煽动一次翅膀就可能引发一场美国的飓风一般，我会尽量避免这种事情发生来为世界和平做一份贡献。”", "“哦！好，厉害。”洛灵梦激动地拍起了手。", "食堂大妈把饭菜放到了窗口并以相当奇怪的眼神看着我。", "这点跟正义人同学差不多。"]}, {"title": "第十一章 食堂里的战争", "body": ["我端着两份干锅烧菜找了个角落的位置坐下，洛灵梦很自然地坐到了我对面。", "夏露可则站在旁边，一副欲言又止的样子。", "\"你站着干嘛，坐啊。\"我用筷子指了指旁边的空位。", "\"我才不要跟你坐在一起。\"她别过头去。", "\"那你站着吧，反正我也没邀请你。\"我夹起一块土豆放进嘴里。", "洛灵梦已经开始小口小口地吃起来，偶尔抬头看看我，又看看夏露可，歪着头似乎在思考什么。", "\"零，绮一，这个，好吃。\"洛灵梦指着盘子里的豆腐。", "\"那就多吃点。\"我把自己盘子里的豆腐夹给她。", "\"喂！你这样会惯坏洛灵梦同学的！\"夏露可终于忍不住了，\"她应该学会自己独立，而不是依赖别人！\"", "我抬起头，用那副死鱼眼看着她：\"哦？所以你刚才跟着我们来食堂，不就是想保护她吗？这不也是让她依赖你？\"", "\"那不一样！\"", "\"哪里不一样？\"", "\"我是为了她好！\"", "\"我也是为了她好啊。\"我耸耸肩，\"你看，我们的目的是一样的，只是方法不同而已。\"", "夏露可被噎住了，脸涨得通红。", "这时候，洛灵梦突然开口：\"夏，露可，你，没有，吃饭，吗？\"", "\"我……\"夏露可愣了一下。", "\"一起，吃吧。\"洛灵梦指了指旁边的空位。", "夏露可看了看洛灵梦，又看了看我，最后还是坐了下来，但明显离我远了些。", "\"我去买饭。\"她站起来，快步走向打饭窗口。", "等她走远了，我对洛灵梦说：\"你还挺善良的。\"", "\"善良？\"洛灵梦歪着头。", "\"就是对别人好。\"", "\"可是，夏露可，也对，我，很好啊。\"洛灵梦认真地说，\"她，总是，帮我，拿东西，还会，告诉我，很多，事情。\"", "我愣了一下。", "是啊，从洛灵梦的角度来看，夏露可确实是在帮她。只是那种帮助的方式，在我看来更像是控制。", "但也许，夏露可真的只是不知道该怎么表达关心？", "算了，这种事情想太多也没用。", "夏露可很快就端着饭回来了，她坐下后一言不发地吃着，但眼睛时不时瞟向洛灵梦。", "\"对了，洛灵梦。\"我突然想起一件事，\"你下午有课吗？\"", "\"有，数学。\"", "\"那你知道教室在哪里吗？\"", "洛灵梦摇摇头。", "我就知道。", "\"那你打算怎么去？\"", "\"跟着，夏露可。\"洛灵梦理所当然地说。", "夏露可听到这话，脸上终于露出了一丝得意的笑容。", "我叹了口气：\"行吧，那你记得下课后来找我，我们一起回家。\"", "\"回家？\"夏露可的声音突然提高了八度，\"你们住在一起？！\"", "糟糕，说漏嘴了。", "\"这个……\"我正想解释。", "\"是的，我们，住在，一起。\"洛灵梦点点头，\"零，绮一，每天，会给我，买，好吃的。\"", "夏露可的脸色变得极其难看，她猛地站起来，椅子发出刺耳的声音。", "\"你这个混蛋！你居然……居然……\"她指着我，手指都在发抖。", "周围的学生都看了过来。", "我感觉到无数道目光聚集在我身上，其中不乏张东超那种幸灾乐祸的眼神。", "\"你听我解释……\"", "\"我不听！\"夏露可打断我，\"洛灵梦同学，你跟我走，我现在就去找校长！\"", "\"找校长？\"洛灵梦歪着头，\"为什么？\"", "\"因为这个人对你图谋不轨！\"", "\"图谋不轨？\"洛灵梦看向我，\"零，绮一，你，图谋不轨，了吗？\"", "我扶额。", "这都什么跟什么啊。", "\"洛灵梦，你知道图谋不轨是什么意思吗？\"我问。", "洛灵梦摇摇头。", "\"那你为什么要问我？\"", "\"因为，夏露可，说的。\"", "\"所以你就信了？\"", "\"不，信吗？\"", "我深吸一口气：\"你记得校长说什么了吗？\"", "洛灵梦想了想：\"他说，让我，住在，你家。\"", "\"对，所以我们住在一起是校长安排的，不是我强迫的。\"", "夏露可愣住了：\"校长……安排的？\"", "\"对啊，不然你以为呢？\"我摊手，\"你要是不信，可以去问校长。\"", "夏露可的脸色变了又变，最后她咬着牙说：\"我会去问的！\"", "说完，她转身就走。", "洛灵梦看着她的背影，又看看我：\"夏露可，生气了。\"", "\"是啊。\"", "\"为什么？\"", "\"因为她觉得我是坏人。\"", "\"你，是，坏人吗？\"", "我想了想：\"也许吧。\"", "\"那，我，也是，坏人吗？\"洛灵梦认真地问。", "\"为什么这么说？\"", "\"因为，我，和你，住在一起。\"", "我笑了：\"傻瓜，这不是你能决定的。\"", "洛灵梦歪着头，似懂非懂地点了点头。", "我看着她那张纯真的脸，突然觉得有些累。", "下午第一节课刚上到一半，班主任就敲门进来了。", "\"零绮一，校长找你。\"", "教室里瞬间安静下来，所有人的目光都聚集在我身上。我能听到有人在窃窃私语，张东超那边更是传来压抑的笑声。", "\"零大哥这是又要去喝茶了啊。\"", "\"肯定是中午食堂那事儿。\"", "\"活该，谁让他……\"", "我装作没听见，拿起笔袋站了起来。反正失败者早就习惯了被人指指点点，多一次少一次也没什么区别。", "走廊上，夏露可正站在校长办公室门口，看到我来了，她冷哼一声别过头去。", "果然是她告状了。", "我敲了敲门。", "\"进来。\"校长的声音一如既往地冷淡。", "推开门，洛灵梦已经坐在沙发上了，手里还拿着一块饼干，小口小口地啃着。看到我进来，她抬起头，嘴角还沾着饼干屑。", "\"零，绮一。\"她挥了挥手。", "校长坐在办公桌后面，面无表情地看着我：\"坐。\"", "我在洛灵梦旁边坐下，夏露可也跟着进来了，站在校长身后，一副正义使者的模样。", "\"夏露可同学向我反映，\"校长开口了，\"你和洛灵梦同学同居的事情在学校里传开了。\"", "\"是的。\"我点点头，\"不过这不是您安排的吗？\"", "校长的眉头微微皱了一下：\"我是安排了，但我没让你们到处宣扬。\"", "\"我也没有到处宣扬啊，是洛灵梦自己说的。\"", "\"洛灵梦同学不懂这些，你应该提醒她。\"", "\"我……\"我正要辩解，洛灵梦突然开口了。", "\"校长，我，说错了，吗？\"她歪着头，一脸无辜。", "校长看着她，叹了口气：\"不是你的错，洛灵梦同学。只是这件事情比较敏感，容易引起误会。\"", "\"误会？\"", "\"就是别人会想歪。\"我补充道。", "\"想歪？\"洛灵梦更困惑了。", "校长揉了揉太阳穴，显然也不知道该怎么跟她解释。", "这时候，夏露可忍不住了：\"校长，我觉得这样的安排本身就不合适！洛灵梦同学是A1的学生，她应该住在学校宿舍，接受更好的管理和保护，而不是跟一个……一个……\"", "\"一个什么？\"我转头看着她，\"一个走后门进来的关系户？\"", "夏露可咬着嘴唇，没有说话。", "\"夏露可同学，\"校长的声音突然变得严厉起来，\"洛灵梦同学的住宿安排是学校经过慎重考虑后做出的决定，不需要你来质疑。\"", "\"可是……\"", "\"没有可是。\"校长打断她，\"如果你对学校的决定有意见，可以让你的家长来找我谈。现在，你可以回去上课了。\"", "夏露可的脸涨得通红，她狠狠地瞪了我一眼，转身离开了办公室。", "门关上后，办公室里安静了几秒。", "\"零绮一，\"校长重新看向我，\"我知道这个安排给你带来了很多麻烦。\"", "\"还好。\"我耸耸肩。", "\"但是你要明白，洛灵梦同学的情况比较特殊。她不能住在学校宿舍，也不能回到她原来的……家里。\"", "我愣了一下。", "原来的家里？", "\"为什么？\"我脱口而出。", "校长沉默了一会儿，最后说：\"这不是你该问的。你只需要知道，照顾好她，是你现在最重要的任务。\"", "\"那我的学习呢？您不是说要我月考进前三百吗？\"", "\"这两件事并不冲突。\"校长站起来，走到窗边，\"洛灵梦同学的学习能力很强，她可以帮你。而你，也可以教她一些……生活常识。\"", "我看了看旁边还在啃饼干的洛灵梦。", "生活常识啊。", "这可真是个大工程。", "\"还有，\"校长转过身来，\"关于你们同居的事情，我刚才已经告诉洛灵梦和夏露可同学不要随意外传。\"", "\"谢谢。\"我是真心感谢的。", "\"不用谢我。\"校长走回办公桌，\"你只要记住，洛灵梦同学的安全是第一位的。如果她出了任何问题，你要第一时间联系我。\"", "安全？", "这个词让我心里一紧。", "\"校长，您的意思是……她会有危险？\"", "校长看着我，眼神变得深邃：\"希望不会。但是，你要做好准备。\"", "这话说得我后背发凉。", "\"好了，你们回去上课吧。\"校长挥挥手。", "我站起来，洛灵梦也跟着站起来，她把最后一块饼干塞进嘴里，鼓着腮帮子看着我。", "走出办公室，我的脑子里一片混乱。", "洛灵梦到底是什么人？", "为什么不能回家？", "为什么会有危险？", "还有，校长为什么要把她交给我？因为我看起来像是没什么正事的家伙？", "\"零，绮一，你，在想，什么？\"洛灵梦拉了拉我的衣袖。", "我回过神来，看着她那双异色的眼睛。", "\"没什么。\"我挤出一个笑容，\"走吧，回去上课。\"", "\"嗯。\"", "她很自然地抓住了我的衣袖，跟在我身边。"]}, {"title": "第十二章 给三无少女买衣服是什么大型直播节目", "body": ["放学这件事，对于我这种人来说，向来是没什么仪式感的。", "铃声一响，我就把练习册往书包里一塞，背着包走人。既不留下来跟同学互道再见，也不去小卖部买什么零食，直截了当地往校门口走。", "这种“放学RTA（快速通关）”的行动哲学，能有效降低触发随机社交事件的概率，是我作为失败者能维持平静生活的唯一手段。", "不过今天有点特殊。", "我靠在校门口的砖墙边，把书包挂在一只手上，百无聊赖地刷着手机，等一个A1的三无少女放学。", "旁边陆续有学生走出来，三三两两，有说有笑，偶尔有几道视线扫过我，大概是在心里给我做个标注：关系户，靠边站。", "我对这种目光的免疫力已经相当不错了，只要脑内防御等级加满，这种程度的视线攻击连我的HP皮毛都伤不到。", "十分钟过去了。", "二十分钟过去了。", "我把手机揣回口袋，抬头望了望天。夕阳把云彩压成橘红色，晒在脸上还带着点余温，风把路边树叶吹得哗哗响。", "一副很好看的放学画面，可惜主角还没出现。如果这是Galgame的转场，我大概已经按坏了十次快进键。", "又过了大约五分钟，我终于在人群里捕捉到那道茶色长发。", "说是捕捉其实不太准确，应该说是——她那种自带高帧率滤镜的存在感，在这一众低多边形的背景路人里，几乎不可能被遗漏。", "洛灵梦从校门里走出来，步伐不快不慢，异色的眼睛扫了一圈，最后落在我身上，顿了一下。", "然后继续朝我走来，面无表情，发梢被风撩着，像是某个动漫的片头OP定格画面。", "我盯着这一幕，心跳频率稍微偏离了正常轨道。我把这个念头在脑子里快速走了一遍，然后强行归档在“此乃错觉”的那一栏里。", "\"零，绮一。\"", "\"嗯，出来了。\"", "\"你，等了，很久，吗？\"", "\"还好。\"", "\"我，以为，你，不会，来。\"", "\"我说要来的。\"我把书包重新背好，侧过脸看她。", "她歪了歪头，似乎在处理这句话，然后点了点头：\"嗯。\"", "走了大概半条街，我才想起来今天出门的目的。", "\"对了，你只有一套衣服对吧。\"", "\"对。\"", "\"那就是说你今天穿的还是昨天那套制服。\"", "\"对。\"", "\"你用一套制服洗了再穿，洗了再穿，不觉得麻烦吗？\"", "\"为什么，会麻烦？\"", "\"因为衣服洗完要晾干，晾干再穿，并且我可没有做好跟你赤忱相待的准备。……你昨晚的衣服洗了吗？\"", "洛灵梦想了一秒，然后非常坦然地回答：\"没有。\"", "好的，这波是我输了。我选择关闭对话框，保持沉默。", "路过一个十字路口，红灯，我们并排等着。旁边有对情侣，手拉手，女生靠在男生肩上叽叽咕咕说着什么。", "洛灵梦看了他们一眼，没有什么表情，又把视线转回来，落在路口对面的奶茶店招牌上。", "\"零，绮一，那个，好吃，吗？\"", "\"奶茶？能喝，但你现在别分心，我们先去买衣服。\"", "\"买，衣服。\"她重复了一遍，像是在把这个概念重新组装一次，\"就是，给我，拿衣服，来，给我穿，的意思，吗？\"", "\"差不多。\"", "\"那，去哪里？\"", "\"商场。\"", "\"商场，是什么？\"", "这一路上的问答简直像是在新手教程里反复打转。洛灵梦是否适合独立在人类社会生存，答案是否定的。如果我手头有评分系统，我绝对会给她的社会化程度打个大大的零分。", "商场的自动门一开，冷气扑面而来，把外头的残余暑气隔了个干净。", "洛灵梦走进去，在自动门处顿了一下，回头看了看门，又走了进来，再往后退出去，让门再开一次。", "\"洛灵梦。\"", "\"再，一次。\"", "\"你在干嘛。\"", "\"这个，门，很有，意思。\"洛灵梦的注意力完全被自动门吸引住了，“它，认得，我。”", "我无力地往旁边一靠，让她多感受了两次自动门的奥秘。这种像是在带初始等级NPC探索新手地图的感觉，竟然意外地不让我觉得讨厌。等她玩够了，我才把她拽进来。", "女装区在三楼。电梯门打开的一瞬间，我确认了一件事：作为一个除了漫展T恤和优衣库就没买过衣服的死宅，我对“给女生选衣服”这项技能的掌握程度，大概和洛灵梦做味增汤的水平差不多，可以等量代换。", "这件事要用理科思维来处理才行。", "第一步：确认需求。", "\"你平时喜欢什么颜色？\"", "\"颜色？\"", "\"就是……衣服的颜色，你想要什么颜色的。\"", "洛灵梦扫了一眼周围那排陈列着的衣服，眼神平静地走过去，最后在一件白色连帽卫衣前停下来。", "\"白色，最不，复杂。\"", "很有道理，简直像是在解一道追求最简形式的代数题。", "我走过去看了看标签，尺码对得上，价格也还算合理，就把它取了下来：\"你想要这件？\"", "\"可以，吗？\"", "\"只要你喜欢。\"", "她接过去，拿在手里看了一会儿，然后非常自然地开始往身上套。", "\"喂，停下！\"我连忙把她拦住，\"你得去试衣间。\"", "\"试，衣间？\"", "\"就是那个……\"我指了指角落里那排拉着帘子的小格子，\"你进去换，不能在外面换。\"", "\"为什么？\"", "\"因为……这是规矩。\"我意识到跟她讲社会规范这件事，可以无限陷入一个“为什么”的嵌套循环里，索性直接把她往试衣间方向推，\"总之进去，换完出来给我看。\"", "她被我推着走了两步，在帘子前停下来，回头看了我一眼，异色瞳里有些困惑。", "\"就你一个人进去。\"我补充道。", "\"哦。\"", "帘子拉上了。", "我站在外面，把两只手揣进口袋，看着天花板上的射灯发呆。旁边有个导购小妹，用一种“现在的年轻人玩得真花”的眼神看了我一会儿。我只能回以一个死宅特有的淡漠微笑，假装自己是个莫得感情的带路NPC。", "里头安静了很长一段时间，长到我开始怀疑她是不是在试衣间里触发了什么异世界传送阵。", "\"洛，灵，梦？\"", "\"嗯。\"", "\"还好吗？\"", "\"在，想，一个，问题。\"", "\"什么问题。\"", "\"如果，我，把里面的衣服，也，脱掉，就不用，再费劲，穿上去，了。\"", "我猛地把声音压低了，这种挑战道德底线的发言是认真的吗：\"你给我千万别这么想！\"", "\"为什么？\"", "\"因为你出来之后这件衣服就算是你的了，不能不穿着出来。\"我用最快的速度编了一个逻辑自洽的理由，\"而且外面有人。\"", "\"有人，怎么，了？\"", "\"有人，就不能，让别人看到你的身体。这是基本设定，给我牢牢记住啊。\"", "停顿了三秒。", "\"明白，了。\"", "又过了片刻，帘子被从里面掀开。", "白色卫衣，尺码略微有些宽松，袖子长了一截，把她的手指半盖住。她站在帘子边上，低头看了看自己，又抬起头看我，脸上还是那副惯常的无波无澜。", "但不知道为什么，在那一瞬间，我感觉周围的空气色调似乎被调高了饱和度，有种说不清楚的……", "算了，作为一个失败者，不该有这种充满现充气息的感想。", "\"合适。\"我扭开视线，\"就这件了。\"", "\"好。\"", "我们又在旁边的架子上挑了两件换洗的内搭和一条简单的休闲裤。洛灵梦全程跟着我走，偶尔指一指某件衣服上的图案，问我：\"这个，是什么，动物？\"", "\"兔子。\"", "\"这个，像，你。\"", "我没忍住往那件印着两只耷拉耳朵兔子、眼神已经死掉的T恤上看了一眼。", "\"我哪里像兔子了。\"", "\"都，是，呆呆的，样子。\"", "\"……那是死宅特有的思考状态好吗。\"", "\"零，绮一，这个，给你，买吗？\"", "\"不用，谢谢。这种嘲讽值拉满的装备不适合我。\"", "结账的时候，洛灵梦站在收银台旁边，看着收银员扫码，又看着我掏钱，表情认真，像是在观察一项精密实验的操作流程。", "\"买，就是，这样的，事情，吗？\"", "\"差不多。\"", "\"给，钱，就可以，得到，东西？\"", "\"对，一种最基础的等价交换。\"", "\"那我，以后，给你，钱，就可以，得到，好吃的，吗？\"", "我把零钱揣回口袋，拎起袋子，往出口走：\"你哪来的钱？你的技能树里可没点‘打工赚钱’这一项吧。\"", "她跟上来，想了一会儿：\"不知道。\"", "\"那这个问题就先搁置吧。\"", "出了商场，夜风已经带了点凉意，路灯把两条人影拉得细细长长的，投在地上。", "洛灵梦拎着装衣服的纸袋，走在我旁边，步伐不急不慢。", "走了大概半个路口，我忽然停下来。", "脑子里有个东西在报警。", "我把今天买的清单在脑内过了一遍：卫衣、内搭两件、休闲裤。", "……", "漏了件很关键的东西。", "昨晚她从浴室走出来，我随手递了浴巾，顺带在心里把\"明天带她买衣服\"提上日程——但当时只想到了外衣。", "内衣这种东西对死宅的采购思维而言根本不在默认清单里，我他\\~妈\\~的漏项了。", "\"怎么了。\"洛灵梦跟着停下来，歪头看我。", "\"你，\"我斟酌了一下措辞，\"内衣只有昨天那一套吧。\"", "\"嗯。\"她点头，毫无波澜。", "\"……你不觉得应该多买几件吗？\"", "她想了一秒：\"为什么？\"", "果然。对她来说\"换洗\"这个概念大概跟\"买\"一样，属于人类社会的默认设定，但在她的知识库里归档为空。", "\"因为，\"我努力保持讲题的语气，\"衣服穿了会脏，脏了要洗，洗了要晾干，晾干需要时间，所以你需要不止一套。这是个很基础的时间差问题。\"", "\"哦。\"她消化了一下，\"那，现在，怎么办？\"", "好，这是一个纯粹的逻辑问题，一个完全合理的生活推断，我作为一个有理性的成年人——不对，高中生，完全可以冷静处理这件事。", "\"我们回去。\"我转身往商场方向走。", "\"嗯。\"她跟上。", "问题在于，我们刚才走出来的那扇自动门，正对着的就是——女装区内衣专柜。", "这是一道摆在失败者面前的人生课题，出题人显然是个FFF团卧底，专门盯着我的血槽设计关卡的。", "我重新走进商场，保持步伐稳定，目视前方，脸上维持着死宅特有的零情绪表达，试图在路过内衣展示台的时候，成功模拟一个毫无感知的低多边形NPC。", "失败了。", "因为洛灵梦在一排展示架前停下来，抬手拎起其中一件，侧过脸问我：\"这个，合适，吗？\"", "\"你问我？\"", "\"嗯。\"", "\"我怎么知道。\"", "\"你，不是，很懂，吗？\"", "\"我懂什么？我懂泡面！\"我把声音压到最低，同时确认了一下周围的导购阿姨正以一种\"见怪不怪\"的眼神从我身上扫过，然后移开视线，大概在心里把我归档到了【带女友来买内衣的高中生，可怜】这一栏。", "不是带女友，我想澄清，但此刻并不是澄清的好时机。", "\"你，去，问，那个人，吧。\"我指了指最近的导购，眼神已经开始望天。", "\"为什么，不是，你？\"", "\"因为她，比我，更懂。\"", "洛灵梦歪了歪头，思考了大约两秒，然后非常自然地走向那位导购，把手里那件举起来，用她铿锵有力的短句风格问道：\"这个，合适，吗？\"", "导购愣了一秒，然后把目光投向站在五米外、正在认真研究天花板射灯分布的我。", "我给了她一个\"请当我不存在\"的眼神。", "她心领神会，职业素养拉满地带着洛灵梦往里走，开始挑选尺码。", "我就这么站在外围，把书包背带攥紧，盯着旁边那排休闲裤的吊牌，假装自己是来比价的。", "大约过了三分钟，洛灵梦从导购手里接过一个小袋子，走回来，把袋子往我手里一塞。", "\"零，绮一，拿。\"", "\"……你自己拿。\"", "\"手，满了。\"她举了举另一只手里的纸袋。", "我接过来，攥在手里，沉默地往外走。", "旁边一对真正的情侣从我们身边走过，男生手里提着差不多的袋子，脸上写着岁月静好。", "我在心里默默把他拉入了黑名单。", "出了商场，夜风已经带了点凉意，路灯把两条人影拉得细细长长的，投在地上。", "洛灵梦拎着装衣服的纸袋，走在我旁边，步伐不急不慢。", "走了大概一个路口，她突然开口：\"零，绮一。\"", "\"嗯。\"", "\"谢，谢。\"", "我侧过头看了她一眼。", "她没有看我，只是平视着前方，茶色的发丝被夜风撩起来，落在她那双异色的眼睛旁边。", "脸上没有什么特别的表情，就是平静。", "但那两个字说得很认真，认真到让我这个习惯了被无视的失败者，竟然也感到了一点点没来由的局促。", "我转回头，耸了耸肩：“没什么。这种程度的小事，我还是办得到的。”", "实际上，这大概也是像我这种人能在这个无聊的世界里，难得做成的一件正确的事了。", "她歪了歪头，似乎没有完全理解，但也没有再追问。", "两个人就这么走着，路灯一盏一盏地亮起来，夜把这条普通的街道照得像是个梦境关卡。", "\"零，绮一，今天，有，好吃的，吗？\"", "\"有，泡面。\"", "\"十级大师，的，泡面？\"", "\"就那一种，那是身为失败者最后的尊严。\"", "\"好。\"她点了点头，表情平静，但声音里有一种我说不清楚的满足。", "我看着前面的路，没有说话。", "失败者不应该有太多感慨，因为这种矫情的内心戏被我贴上了现充专有的标签。"]}, {"title": "第十三章 三无少女的收视率", "body": ["到家的时候，时针刚过八点半。", "我把钥匙插进锁孔，门开了，两个人先后走进去。洛灵梦把装衣服的袋子放在沙发上，然后站在客厅中间，不动了。像是一个突然断开服务器连接、失去指令只能卡在原地待机的游戏角色。", "我把书包挂上，转头看了她一眼：\"怎么了。\"", "\"那个。\"", "她用视线指了指电视机。", "一台普通的液晶电视，黑屏，安静地挂在墙上。在过去这几天里，它一直维持着这种冬眠状态。毕竟对现代人来说，电视机早就退化成了一块昂贵的黑色墙壁装饰板，我回来以后通常要么看手机，要么什么都不干，直接进入省电模式。", "\"你想看？\"", "\"它，可以，亮，吗？\"", "\"可以。\"", "\"为什么，今天之前，它，一直，没亮？\"", "\"因为没人开。\"", "洛灵梦盯着电视机看了三秒，表情认真，像是在重新评估这件家用电器的存在价值：\"手机，也，可以，看。\"", "\"电视屏幕更大。\"", "\"大，有什么，用？\"", "这是一个我在小时候也问过我爸的问题，当时他的回答是\"大了就是好\"，我认为这是一个犹如\"多喝热水\"般敷衍透顶的答案，充满了老一辈不讲道理的大炮巨舰主义。但此刻面对毫无常识的洛灵梦，我发现自己找不出比这更通俗的解释。", "\"大了，就是，好。\"", "我从抽屉里翻出遥控器，按了开机键。", "屏幕亮了起来。", "洛灵梦盯着那片突然亮起来的光，往前走了两步，停在电视机正前方，距离大概一米，往下一坐，直接盘腿坐在地毯上，仰头看着。那姿态活像一只初次见到营火的野生动物。", "画面里，某个我不认识的都市剧正在播，男女主角在咖啡厅里对坐，女方在哭，男方沉默着把纸巾递过去。背景音乐极其悲戚，光线昏黄，一派试图强行榨取观众眼泪的劣质苦情现场。", "我在沙发上坐下，把遥控器放在旁边，往后一靠，开始思考泡面问题。", "昨晚的存货还剩两桶，一桶红烧牛肉，一桶香菇炖鸡。从情绪配对学来讲，看苦情剧吃红烧牛肉是正确选项，能用重口味抵消屏幕里溢出的工业悲伤；而香菇炖鸡有一种清淡的、不知道该配什么的漂泊感，更适合用来祭奠我那毫无波澜的青春。", "我站起来往厨房走，背后传来洛灵梦的声音：\"零，绮一。\"", "\"干嘛。\"", "\"那个，女的，为什么，哭？\"", "我回头看了一眼屏幕，剧情已经推进到男方站起来、背对镜头、握了一下拳头又松开这一经典桥段。老实说，这男演员的手部抽搐式演技大概连话剧社的门槛都够不上。", "\"可能是因为感情问题。\"", "\"感情，问题。\"她重复了一遍，咀嚼这个词，\"感情，是什么，问题？\"", "\"就是……\"我想了想，试图把复杂的社会学现象降维解释，\"两个人在一起，然后出了什么不可名状的系统错误，导致其中一个人很伤心。\"", "\"在一起，做什么？\"", "\"过日子。\"", "\"我们，也是，在一起，过日子。\"", "\"我们那叫同居，性质不一样。\"", "\"哪里，不一样？\"", "这个问题的答案涉及到一整套我目前没有资格给她讲的人类社会情感建构理论，解释起来的文本量堪比几百万字设定的世界观设定集。而且厨房里的水壶已经烧开了，现在显然不是展开长篇大论的好时机。", "\"等我把泡面做好再说。\"我成功地用食物转移了话题的优先级。", "洛灵梦转回去，继续盯着电视。", "我用最快速度泡好了两桶面，拎出来，往茶几上一放，然后重新坐到沙发上。", "\"好了，吃。\"", "洛灵梦没有立刻动，眼神还停在屏幕上。剧情已经切到下一幕，男女主角站在楼道里，男方用两只手捧住女方的脸，说了什么台词，字幕我没认清，女方眼泪一下掉下来，然后两个人抱在一起。", "悲伤的背景音乐瞬间拉满，恨不得从屏幕里伸出手来按着观众的头强行感动。", "洛灵梦看了大约五秒，沉默地转过头，端起泡面，吃了一口。", "\"那个，男的，用手，捧她的脸。\"", "\"嗯。\"", "\"为什么？\"", "\"因为……\"我拆了筷子，搅了搅面，试图用最无聊的语调解构这个画面，\"这是一种视觉符号，用来安慰她。表示在意她。\"", "\"捧脸，等于，在意，吗？\"", "\"差不多是这个意思。\"", "洛灵梦低头把面吃了两口，没说话。我以为这个话题就此结束了，毕竟三无少女的大脑缓存通常不会在一个无用信息上停留太久。我开始专心处理我的红烧牛肉面。", "然后，大概过了三十秒，我感到左边一阵轻微的动静。", "我转头。", "洛灵梦已经从地毯上起来，不知道什么时候坐到了沙发上——坐在我旁边，面对着我。她放下泡面桶，然后非常认真、非常一板一眼地，伸出两只手，捧住了我的脸。", "冷的。她的手指是冷的，带着刚才盖子还没完全捂热的温度，然后稳稳地放在我的两颊上。", "我整个人的思维中枢在那一瞬间仿佛遭遇了不明黑客的物理攻击，直接触发了全局死机，脑内似乎响起了处理器超载导致风扇狂转的幻听。", "她离得很近，异色的眼睛平静地对着我，脸上没有任何表情，认真且专注。这根本不是什么偶像剧里的发糖环节，这态度严谨得就像是在把一道化学实验步骤完整复现。", "\"这样，是，在意，吗？\"", "\"……你在，干什么。\"我的声音控制得比预期还算稳，这大概要归功于我长期以来的面瘫式自我修养。", "\"学，电视，里的。\"", "\"你别乱学。\"", "\"为什么，不能，学？\"", "\"因为，\"我把她的手从我脸上移开，原路退回放到她自己那边，\"这个动作是有前置解锁条件的，要看场合，不是随便乱用的公共技能。\"", "\"什么，场合，可以用？\"", "\"就是，很在意对方的时候。\"", "\"我，在意，零绮一，\"她说这句话的语气和\"今天去买白菜吧\"在同一个频段，毫无起伏，\"因为，没有，零绮一，就没有，好吃的，泡面。\"", "很好，破案了。结论是她在意的是泡面，而我本人的定位仅仅是一个能刷新出泡面的工具人附属品。这个残酷但极其合理的逻辑链，瞬间让我的思维系统恢复了正常运转。", "\"那是你对泡面的感情，不是对我的。\"我捞起筷子，带着一种认清现实的坦然，重新看向电视。", "\"不，一样，吗？\"", "\"很不一样。\"", "她想了三秒：\"好吧。\"然后端起泡面桶，转回去，继续看电视，仿佛刚才那件事是一道已经验算完毕的附加题，批完分，直接翻篇。", "屏幕上男女主角已经切到了新场景，两个人在夜晚的河边走路，肩膀挨着肩膀，对话听不清，只有那种打光师生怕观众看不出来\"他们一定会在一起\"的廉价氛围光打在脸上，简直像夜间捕鱼探照灯一样刺眼。", "洛灵梦看了一会儿，侧过头，对我说：\"他们，也在，过日子，吗？\"", "\"某种意义上，是的。\"", "\"和我们，一样？\"", "我把最后一口面送进嘴里，咀嚼，咽下，没有立刻回答。", "\"不一样。\"", "\"哪里，不一样？\"", "\"他们，\"我把筷子搁在桶沿上，思考了大概一秒，给出了一个我认为足够精准的答案，\"知道彼此对自己来说是什么。\"", "洛灵梦停顿了片刻，似乎在脑内把这句有点绕口的话重新编译了一遍。", "\"那，零绮一，\"她没有看我，视线还在屏幕上，\"我，对你来说，是什么？\"", "我没有说话。这种直球往往最难接，因为无论是闪避还是防御，都会暴露自己的位置。", "客厅里只有电视的声音，某个配角正在讲一段关于错过的台词，调子软得像一首被唱走调的歌。", "窗外夜风把窗帘撩起来，又放下去。", "\"麻烦。\"我最终开口，语气平平。", "\"麻烦，是什么，意思？\"", "\"就是……\"我稍微顿了一下，\"像那种完全没有任务提示，会让我操心，但一旦触发了就没办法放弃的强制支线。\"", "洛灵梦低头看了看自己的泡面桶，面已经快吃完了，她用筷子把最后几根面条归拢了一下。", "\"那，零绮一，\"她问，声音还是那个没有起伏的调子，\"你，喜欢，麻烦，吗？\"", "我重新拿起遥控器，把电视切了个台，找了个没什么剧情压力的做菜节目，把音量调小了两格。", "\"不喜欢。\"我说。", "然后我侧眼看了她一眼，她正认真地把最后一根面条送进嘴里，咀嚼，吞下，表情平静，毫无后续。", "我转回去，盯着屏幕上某个正在接受采访的厨师。", "确实不喜欢麻烦。这是每一个追求最快通关路径的生存玩家的本能。", "但该管的，还是会管。", "在我那套赖以生存的避险逻辑里，本来就不该有\"在意\"这种高消耗的词条，只有\"不能让小麻烦滚雪球变成大灾难\"这种清醒的成本核算。我的脑子很清楚，我的账本记录得一笔不差。", "至于那两只冷冷的手指贴在脸颊上的触感，以及那一瞬间心跳产生的微弱偏差，已经被我熟练地全选，统一拖进了名为\"错觉与无效感知\"的回收站里，并且清空，绝不展开。", "\"零，绮一，\"洛灵梦把空桶放回茶几，\"明天，我，做的，味增汤，你，一定要，喝完。\"", "\"你做成什么灾难级别的水平我就喝成什么视死如归的心情，这是规矩。\"", "\"这次，会，更好，的。\"她说这句话的时候，语气比平时多了一分——不知道该叫什么，像是一种极度笃定的东西，哪怕她连常识都没有，但这份笃定平静得不容反驳。", "我没吭声，重新靠回沙发背上。", "窗帘又被夜风撩起来一角，带进来一点八月末的、快要不剩多少的暑气。", "电视里的综艺节目有人在笑，笑声很大，在这个小小的客厅里听起来有点空旷，却莫名地并不算吵闹。"]}, {"title": "第十四章 灾难进化论", "body": ["我不是一个习惯早起的人。", "准确来说，我和清晨之间的关系属于长期冷战状态——双方各自划定了势力范围，互不侵犯，和平共处，这套协定过去十七年运转得相当稳定。偶尔被闹钟强行破防的那些早晨，也只会让我用一种近似于\"被人抢了最后一格血\"的阴沉表情，把整个上午都过成debuff叠满的行尸走肉模式。", "所以当我在七点整，比闹钟早了整整二十分钟自然醒来的时候，我的第一反应是——系统报错。", "我盯着天花板看了大概三十秒，确认自己确实是醒的，不是什么奇怪的假睡状态，然后侧头看了一眼窗外。天光是那种刚从深蓝色里脱壳出来的浅灰，云层很低，带点要变天的意思，风把窗帘的边角吹起来，又轻轻放下。", "然后我意识到是什么把我弄醒的。", "厨房有声音。", "细碎的，锅盖轻轻被掀起来放下的声音，煤气灶低档燃烧时那种沉稳的嗡鸣，偶尔夹杂着木勺搅动汤汁的均匀刮底声。", "我在床上躺了大概十秒，在脑子里把这些完全违背\"前两日厨房毁灭者\"这一角色定性的声响快进了一遍，进行了一次简短的自我诊断：要么是我嗅觉系统还没完全上线，在跑空载；要么隔壁的声音传过来了；要么是某种集体幻觉的单人副本，专为我一人开放。", "但焦糊味确实没有。", "这已经是一种超出历史纪录的异常了。我踹开被子坐起来，穿上拖鞋，把头发随手拢了拢——这个动作的实际意义大概相当于试图用一根筷子搅平太平洋——然后推开门走出去。", "厨房的灯是亮着的，暖黄色的光从没合严的门缝里漏出来，在走廊地板上拉了一条细长的亮线。", "我推开厨房的门。", "洛灵梦站在灶台前，背对着我。她穿着昨天买回来的白色卫衣，头发没有绑，散在肩膀上，茶色的发尾因为她偶尔低头的动作往前滑了一缕，她用手背随手把那缕头发撩到耳后，继续用木勺缓慢地、专注地、以某种我只在理化实验课或者BBC纪录片里见过的严谨程度，搅动着锅里的汤。", "灶台上整齐摆着：量杯，小秤，三个分别装着不同材料的小碟子，以及一张正面朝上压在旁边的笔记——手写的，密密麻麻，充斥着箭头符号和批注，宛如实验室原始记录表。", "我在心里盖了个章：天才学霸式做菜现场，再次如期出现。", "但这次，飘出来的味道，不太一样。", "我在厨房门口站定，轻轻吸了口气。", "是味增汤的气味，浓淡合适，带着豆腐和海带丝的清香，没有焦味，没有任何可疑的化学实验室气息，甚至带出一种相当接近\"人类可以安全摄入\"的食物香气，悄悄从那口锅里漫出来，弥漫在这个不大的厨房里。", "我的大脑在那一刻经历了短暂的认知错位——不是因为什么触动，纯粹是这件事和我基于已有样本建立的预测模型产生了严重偏差，而我的大脑拒绝在睡醒后二十秒内完成修正。这大概就是现实对我发出的一条系统提示：【角色洛灵梦的属性发生了变化，请更新数据库。】", "\"……你几点起的。\"", "洛灵梦听见声音，回头看了我一眼，异色瞳里照常是出厂设置般的平静：\"六点，十五分。\"", "\"为什么起那么早。\"", "\"汤，需要，时间。\"她转回去，用木勺轻轻在锅沿点了点，\"昨天，我重新，计算了，配比，和火候，都需要，校正。\"", "\"你用量杯做味增汤。\"", "\"精确，才能，复现，好吃的。\"", "这套逻辑我无从反驳，因为它在结构上完全自洽，只不过她硬生生把一款家常料理做成了理化实验操作课。这让我想到一个相当残忍的比喻——她和普通人之间的认知鸿沟，大概相当于一个把\"把鸡蛋敲破\"写成\"对蛋壳施加垂直方向冲击力，使其沿应力集中点产生裂缝\"的物理系学生，逻辑严密，没有任何问题，就是让旁边的人看着有点头皮发麻。", "我走进去，凑近看了一眼那张笔记。", "上面甚至有失败的复盘记录。不是普通的\"今天没做好\"，是真正意义上的实验记录格式：编号、变量、结果、误差分析。", "第一次：\"操作超时，未进行生物学评估。\"——那次她把水烧开的时候已经到了迟到临界点，我只能抓起书包把她强行拽出门，那锅汤最终的命运是留在灶台上自然冷却，连被评价的资格都没有拿到。", "第二次：\"氯化钠浓度过高，导致渗透压失衡。\"——那次我喝了一口，感觉自己像一条正在被腌制的咸鱼，喝了两大杯白水才缓过来。她把\"太咸了\"记录成\"渗透压失衡\"，我当时的心情是一种无法准确定性的复杂，现在想起来，主要情绪是荒诞。", "第三次，有一行字夹在备注栏的角落里，不显眼，但写得很认真：", "\"水温七十五度时加入味增，避免高温导致蛋白质变性析出。需验证。\"", "旁边附了个公式。", "以她目前的认知水平，大概还无法理解\"风味\"这种高度主观的感官词汇，所以她只能用最冷冰冰的化学反应来解释食物的变化。六点十五分起床，对着一张密密麻麻的记录表，把前两次的失败折成数据往第三次里填。我见过比她聪明的人，但我不确定我见过比她认真的人。", "——这个念头冒出来之后，我以迅雷不及掩耳之势在脑内把它掐灭了。", "我把那张纸放回原位。", "\"好了，\"洛灵梦关了火，侧过头，语气里第一次带了某种薄薄的、被刻意压住的东西，像是一层细心折叠起来的期待，\"你，尝一下。\"", "她盛了一小碗，放在灶台边上，往我这边推了推。", "我端起碗，低头看了一眼。汤色清亮，豆腐切成均匀的小块，海带丝颜色正常，葱花撒得稀稀落落，有点不均匀，但看得出来是认真放了的。", "我喝了一口。", "温度合适，不烫，不凉。", "味道，是正常的味增汤的味道。", "我在这里停顿了一下，因为\"正常的味增汤的味道\"这句话本身，放在她做出来的东西上，实在是一句相当不寻常的评语。就好像有人郑重其事地宣告\"这辆车，今天没有爆炸\"，然后你意识到这确实是一条值得被记录的新闻。", "不算惊艳，但扎扎实实落在了\"可以入口\"这条线的里面。豆味适中，咸淡没有出格，海带泡得软了，带着点顺滑的口感，和豆腐的绵软构成了某种平衡。", "和之前那两次相比——第一次没时间吃，第二次咸到让我差点原地脱水——这碗汤，终于越过了某一道分水岭，勉强进入了人类正常食物的合法管辖范围以内。", "我把碗放下。", "\"怎么样，\"洛灵梦看着我，异色的眼睛里有某种极其细微的东西，像湖面刚被风划开的那一道浅浅的纹路，\"好喝，吗？\"", "\"……及格。\"", "她沉默了一秒，又问：\"及格，是，什么，意思？\"", "\"就是，\"我把碗往她那边推了推，示意她盛给自己，\"跨过了那条最低的线，没有失败，但距离好喝还差着几个身位，先别急着庆功。\"", "\"及格，不算，很好？\"", "\"及格就是及格。这是第一次做到位，是正常的起点，不是终点。\"", "我说这话的时候，语气尽量压得平一点。不是不想夸她，是夸了之后我就得面对自己为什么觉得有必要夸她这个问题——这条思路一旦追下去，最后一定会绕到一个让我局促的死胡同，所以还不如从入口就掐断，防患于未然。", "洛灵梦低头把汤盛进自己的碗里，喝了一口，停了三秒，然后发表她的客观评价：\"比，昨天，好喝，很多。\"", "\"嗯。\"", "\"及格，\"她重复了一遍这个词，认真地把它咀嚼了一遍，好像在核对某个新获取的词条定义，\"我，记下了。\"", "我去卧室换衣服，出来的时候她已经在洗锅了，袖子卷到了手肘，水开得有点大，把白色卫衣的袖口边沿溅湿了一小片，她低着头，对着那口锅进行毫无死角的清洗，专注到近乎严肃。", "我看了两秒，去拿了书包。", "\"快点，上学了。\"", "\"还，有，四分钟，五十八秒。\"她头也没抬，\"时间，够。\"", "\"你怎么不看表就知道？\"", "\"算，的。\"", "我选择不深究这个问题背后的推导过程，因为深究下去需要消耗的脑力已经超过了我清晨七点的认知上限，属于性价比严重为负的操作。", "早晨的街道有点潮湿，昨晚的夜风把路边树上的叶子吹落了几片，贴在地砖上，湿哒哒的，踩上去没有声音。空气里有一种清薄的凉意，不算冷，只是和前几天的暑热相比，像是季节终于想起来要换季了，悄悄把温度往下调了一格，也不打招呼，就这么自顾自地凉了。", "路上行人各自低头赶路，表情大同小异地倦怠——标准NPC晨间巡逻路线，没什么好看的。洛灵梦走在我旁边，书包背得规规矩矩，头发被风吹动，细细的茶色发丝飘过来又飘回去，她的视线平静地落在前方的路上，脚步均匀，走路的姿态有种不太像普通高中生的安静感，好像她不是在走路，而是在执行某种经过精确规划的位移程序。", "走在她旁边有时候会产生一种微妙的违和感，不是不舒服，是那种你知道眼前这个角色的立绘精度明显高于当前场景的背景板，但她就是出现在这里了，你也拿她没什么办法。", "我不打算继续这条想法。", "走了大概半条街，她开口：\"今天，学校，有，什么？\"", "\"上课，\"我说，\"你那边可能有习题课，我那边可能有自习。\"", "\"自习，是，学习，吗？\"", "\"自习理论上是自己学习，实践中是各凭本事的消遣时间。\"", "\"你，自习的时候，做什么？\"", "\"睡觉。\"", "她停顿了一拍：\"睡觉，是，学习，吗？\"", "\"睡觉是让大脑停止做无用功。从效率角度看，比强撑着盯天花板更接近'不浪费时间'的定义。\"", "洛灵梦把这个论断在脑子里过了一遍，最终给出她一贯简洁的评价：\"好吧。\"", "我在心里补了一句：跟你解释这些，本身就是我今天最大的无用功之一。", "路口的信号灯是红的，两个人在斑马线前停下来。旁边有个卖早点的摊子，油条刚出锅，蒸笼里的雾气往外漫，在清早的冷空气里扩散开来，气味不算难闻。", "洛灵梦转头看了那个摊子三秒，然后转回来，没有说话。", "\"想吃？\"", "\"我，不认识，那个。\"", "\"油条豆浆，本地人的标准化早餐选项，绝大多数人从小吃到大，属于不需要理由的存在。\"", "\"好吃，吗？\"", "\"多数人觉得是的。\"", "她再次看了那个摊子一眼，然后把视线收回来，面向前方，语气平稳：\"我，今天，做了，味增汤。\"", "\"……吃了。\"", "\"所以，不用，再吃，别的。\"", "信号灯变绿，人群开始过马路。洛灵梦跟着走，我跟上。", "这句话的意思是什么，我没有细想——或者说，不是没有细想，是想了一秒，然后判断继续想下去的成本高于收益，执行主动中止。只是走在她旁边，看着这条被晨光照得不那么灰暗的街道，脑子里像是有什么东西一闪而过，还没来得及看清就被我按下去了。", "她六点十五分起床，对着一张写满箭头标注的笔记，把一锅汤从\"致命风险\"推进了\"勉强合格\"的范围以内，然后现在告诉我，不用再吃别的了，因为她今天已经做了汤。", "一个连\"买\"的概念都是近两天才建立的人，用量杯和误差分析，第三次，把这件事做对了。", "我察觉到自己心里产生了一丝不该有的、近似于\"这件事确实值得被认可\"的情绪。然后我想了想，果断把它归档到了\"系统误报\"的分类里，盖章存档，关闭窗口。一个把自己钉在失败者坐标上的死宅，感动个什么劲，剧本都不带这么写的。", "\"走快点，迟到了你那个班主任会来找麻烦的。\"", "\"会，吗？\"", "\"你是A1班的，那个段位的班主任是什么性情，你回头自己摸清楚，我没有一手数据。\"", "洛灵梦沉默了两秒，步伐微微加快，和我并排走着。", "M中的校门在前方两个路口处，已经有学生陆陆续续走进去，书包和脑袋在人群里晃，构成一幅放眼整个城市都大同小异的、平凡的校园早晨。", "我走在里侧，她走在外侧，夹在人群和我中间，安静地，不疾不徐地，跟着这个早晨往前走。", "进校门的时候，洛灵梦放慢了脚步，在我旁边顿了一下。", "\"零，绮一，\"她开口，还是那个一贯的、不带任何修饰的调子，\"晚上，做，更好的，味增汤。\"", "\"驳回。\"我毫不犹豫地把这个提案拦了回去，\"味增汤是早餐，不是晚餐。早上的专属内容，晚上就不在服务时间内了。而且你厨房事故的发生率本来就高，白天出问题我还能当场处理，晚上万一翻车，我第二天还要去上学，维修窗口不够用。\"", "洛灵梦微微歪了歪头，把这个论断在脑子里迅速处理了一遍，像是对某条规则进行了录入和确认。", "\"那，明天，早上，做，更好的。\"", "\"行了，进去吧，你们A1早读快开始了。\"", "洛灵梦看了我两秒，然后转身，沿着通往A区的走廊，脚步平稳地走进去，茶色的发尾随着走动的幅度轻轻摆了两下，然后消失在转角后面。", "我在原地站了一会儿，看着那个转角，没什么表情。", "早读钟声在七秒后准时响起，把这个普通早晨的最后一点安静切了个干净。", "我把书包往上拎了拎，转向平行班区域走去。", "及格，她说会做得更好。", "鉴于她那个近乎荒谬的学习效率，这句话大概率不是空口承诺，甚至是某种相当可信的预报。我确实隐约对明天的早晨产生了一丝期待——这个念头出现的速度快得让我来不及拦，等我意识到的时候它已经在脑子里占好位置了，一副安营扎寨要住下来的架势，颇为嚣张。", "我沉默了两秒，把它结结实实地按下去。", "失败者没资格攒期待值，那是氪金玩家才用得上的功能。", "脚踩上台阶的时候，清晨的风从操场那边吹过来，带着点湿漉漉的草木气息，把制服领口那里撩凉了一下，挺清醒的。", "今天大概不会太难熬。", "——但我决定不深究这句话是从哪里冒出来的。"]}, {"title": "第十五章 旁观者的提问与我不打算回答的那些事", "body": ["数学老师今天讲的是集合。", "准确来说，他走进来的时候，黑板上还残留着上一节课的一大段板书——那是政治老师留下的遗迹，关于“经济基础与上层建筑”的辩证关系，字写得一笔一划，端正到让人怀疑他是不是拿着圆规和直尺在写汉字。数学老师拿起黑板擦，行云流水般将其物理超度，换上了一个巨大的集合韦恩图。动作之干净利索，让我隐约觉得这不仅是擦黑板，更是理科对文科领土的无情兼并。", "我在第四排靠窗的位置，把课本翻到对应页码，然后基本停止了对课堂的主动参与，进入了节电待机模式。", "窗外的操场有人在早锻炼。两个跑步的男生绕着跑道兜圈，步伐整齐，像是某种被安排进场景里、用来向玩家证明“本游戏确实是校园题材”的背景NPC。光线是上午十点特有的斜射角度，把桌面上一块区域照成淡金色。我把手搭在桌边沿，指节停在那片金色的边界线上，仿佛跨过去就会触发什么隐藏剧情。", "脑子里，不太合时宜地，又飘回了今天早上的事。", "那碗味增汤的味道。", "温度合适，咸淡没有出格——我当时给了一个“及格”的评价，然后迅速切换话题，把这件事在日常任务表上归档，打上“已处理”的标记，强行结案。", "这本来是死宅处理信息的标准流程，不存在需要复盘的节点。", "但问题在于，“及格”这个词被我说出口的时候，是建立在“她六点十五分起床，带着一张密密麻麻的实验记录表，把前两次的失败数据逐条拆解，然后重新验证”这个离谱前提之上的。这件事严重超纲，完全击碎了我对她的初始建模参数。导致这张档案在我的脑内数据库里弹出了一个巨大的、闪烁着红光的提示框：【目标NPC已进化，是否更新你的随行指导员版本？】", "我还没决定要不要点确认。", "真正让我有点坐不住，甚至在走廊上吹风时都觉得有些不对劲的问题是——她那么认真地去把一件事做对，那我呢？", "我是说，她连“买东西需要付钱”这种基础生存概念都是前两天才录入系统的废柴美少女，居然在厨房这个高难度副本里完成了从零到及格的跨越。而我，一个在这个社会上已经安全运行了十七年的老设备，目前的厨艺库存居然只有：煮泡面、烧开水、以及紧急情况下的蛋炒饭——且炒出来的鸡蛋拥有防弹衣般的物理韧性。", "如果她明天早上把味增汤做到良，后天做到优秀，甚至大后天端出了一锅发着金光的特级料理，我拿什么应对？", "继续端着纸碗泡面在旁边当无情的评委吗？这场名为“日常饲养”的放置类游戏，难道要滑向被“反向投喂”的屈辱路线吗？", "不行，绝对不行。哪怕是为了维护我作为前沿向导的尊严，我也必须拿出点实际行动。难道我也去卷味增汤？那更蠢了，在同一个赛道和新手抢业绩简直是败北者的哀鸣。要做就得做正常的菜色——比如青椒肉丝，或者番茄炒蛋，再不济也得是个红烧肉。必须是那种能盖在米饭上的正经碳水伴侣，用实体菜色的降维打击来重塑我摇摇欲坠的威信。", "我在心里划定了一个作战计划，虽然有点心虚，但勉强把那个问号镇压了下去。", "“……同学。”", "一个声音，比讲台上的教学声小几个量级，带着极其小心翼翼的控制感，像是生怕音量稍微调大一点就会触发我身上的自毁程序。", "我侧过头。", "坐我斜后方一个位置的女生正微微弓着背，把身体往我这边凑了一点点。那个弓背的姿势很有辨识度——不是懒散，是那种习惯性地把自己的存在感往里压缩的潜行姿态。", "宁唯。", "班里极少发言、考试成绩稳定在中游、午饭通常一个人吃、连打喷嚏都会捂得严严实实的那种人。我对她的了解基本只有名字和座位，属于路人甲梯队里的优秀代表。", "她正用一种极其谨慎的眼神看着我，像是在评估我接下来的反应会不会把她生吃掉。", "“……有事？”我压低声音，把音量调到课堂副频道的通用标准。", "她又往前凑了一点，声音压得更细：“就是，昨天那件事……你跟A1那个女生，在食堂的事。”", "昨天的遗产。", "我在心里把那件食堂事件快进回放了一遍。时间轴大概是：夏露可拿着某种抽象逻辑来找洛灵梦麻烦，我介入，然后发展成了我说一句她驳一句的低效率回合制RPG，最后我用几句话把局面强制跳过，夏露可气走，此案告一段落。", "但在旁观者的视角里，这个瓜显然还没吃完。", "宁唯看着我，等我回应。那张脸上“不确定问这个会不会惹麻烦”的战战兢兢，被她控制得相当明显，但她大概不知道，这种小心翼翼本身，已经像弹幕一样从她脑门上飘过去了。", "“那件事啊，”我侧过脸，调整了一下坐姿，声音压得很平，“普通的跨频聊天失败现场，没什么。”", "“是……是吗。”她停了一下，欲言又止，然后像是积蓄了一点魔法值，微微皱着眉补了一句，“但是……那个，我今天早上在走廊见过那个A1的女生。她……好像随时要拔刀的样子。”", "“情绪波动在统计意义上属于正态分布，”我用理科生的冷酷语气回答，“她今天看起来想砍人，说明她昨天至少平静过。这只是每月的定期破防，校园NPC的常见刷新机制，非常正常。”", "宁唯把这句话在脑子里艰难地编译了一遍，那张脸上闪过某种“你是不是在用黑话骂人”的微妙表情。", "她沉默了三秒，然后像是攒够了今天的全部勇气，把终极问题推了出来：“那个……你旁边那位，就是，经常跟你一起来上学的那个女生……她是？”", "我没吭声。", "“我，我不是那个意思，”她察觉到我的沉默，立刻条件反射式地往后缩了缩，仿佛进入了防御状态，“就是……见过几次，她长得太……特别了，有点好奇。”", "我打量了她一眼。", "这种好奇心太正常了。洛灵梦走在任何一条街上，大概都会在沿途制造不同程度的视觉污染和交通拥堵，这是她作为一个把异色瞳和“对世界的运行方式感到懵逼”打包成出厂设置的角色，自然附带的范围嘲讽光环。", "问题在于，要解释这事儿，成本太高。", "“这个问题，”我停顿了半秒，用一种处理微积分时才会启用的神棍语气缓缓开口，“本质上涉及薛定谔的室友坍缩态。不同的观测视角会让同一段关系产生不同的集合归属。你现在观测到的那个视觉投影，和我实际在维护的那个高维麻烦，不一定处于同一个逻辑位面。”", "宁唯：“……”", "她在那边愣了大约两秒，眼神彻底清澈了，透出一种“对不起我不该和外星人搭话”的清澈。", "“所以……？”她垂死挣扎。", "“是我能解释清楚的范围之外的报错代码。”我面不改色地收了尾，翻了一页课本，“你当做系统bug理解就行。”", "宁唯沉默了一会儿，那双眼睛在我身上停了停，像是在确认这到底是精神病发作还是委婉的拒绝——然后大概得出了“不管哪个都最好别惹”的结论，微微点了点头，把那股子好奇心彻底掐灭在摇篮里。", "“那……你平时照顾她，应该很费心吧？”", "这句感叹倒比预期更纯粹一点。没有八卦，就是字面上的同情，配上她那张常年保持低调的脸，反而显出了几分真诚。", "我转回去，看着黑板上数学老师新画的韦恩图，想了一秒。", "“不算多。”", "这是一个相当准确的答案——买衣服、买菜、调火候、阻止她把盐当成魔法粉末撒进锅里，这些事情拆开来单独计量，全都是低成本的机械操作。", "我就是这么觉得的，逻辑清晰，账本明白，我可是个只看重性价比的冷静玩家。", "“嗯……”宁唯在那边轻声应了一声，随后彻底安静下来，把自己的存在感重新调回了潜行模式。", "黑板上，粉笔声均匀，节奏稳定。", "我重新把视线落在课本上，盯着那行集合定义，脑子里却悄悄切开了另一个搜索窗口。", "洛灵梦那张写满箭头的复盘笔记再次浮现。", "如果是做正常的菜色，本质上不过也是一套“输入-处理-输出”的流程。变量是火候、配料比、时间，每个变量有相对固定的可操作区间，不存在什么玄学。连她那种把微波炉当异界传送门的家伙都能搞定一碗及格的味增汤，我堂堂一个玩过《胡闹厨房》并且没砸手柄的资深玩家，弄个青椒肉丝的初级副本还不是手到擒来？", "我停笔，盯着课本空白处自己无意识画出来的一口平底锅的简笔画，沉默了大概三秒。", "我意识到，我在用一种极其不服气的态度，试图在厨房这个赛道上找回场子。", "算了，这件事今天先建个文件夹。", "放学顺路去趟超市，买点猪肉和青椒。不，也许再买个番茄以防万一。", "当然，这不是为了跟一碗味增汤较劲，纯粹是我觉得最近泡面的防腐剂吃多了，本机的肠胃系统需要排毒。", "这句话我在心里重复了一遍。说服力高达百分之零，但姑且先当做任务说明用着吧。"]}, {"title": "第十六章 超市猎场与人类采购行为观察报告", "body": ["放学的时候，天阴了半边。", "云压得很低，那种蒸而不下的暧昧灰色，像极了某个说\"我没事\"但语气里藏着三层情绪的角色——你知道它要下雨，它知道你知道，就是不肯痛快，偏要在天边这么吊着。空气里多出来一股土腥气，被风送到走廊里，掺进油墨气和扫帚扬起来的陈年灰尘里，调成一种非常具有\"今天是普通星期三\"辨识度的复合气味。", "我在平行班区域的走廊等了大概四分钟，洛灵梦准时出现在A区和普通区域的分界廊道入口，书包背得端正，学校的制服穿得一丝不苟，只有袖口处残留着一点没完全消失的水痕——早上洗锅时留下的，浅浅的，快干了。", "\"走。\"", "\"去，哪里？\"", "\"超市。\"", "她跟上来，步伐平稳，在我左边半个身位的位置自然落定，像是这个队列排布经过某种事先运算、结果已经写死了。", "\"超市，是什么？\"", "\"大型商品集散地。把各种生活必需品归拢在同一个空间里统一销售，明码标价，自动结账，目前已知效率最高的批量采购场所。你不需要逐一搜索散点摊贩，只要把清单里的东西找出来放进购物篮就行了。\"", "洛灵梦把这套说明在脑子里走了一遍，点头，语气认真：\"好。\"", "\"但是，\"我往下补了一条，\"里面所有东西都有主人。选好了，要付钱，才能带走。不能随便拿，这个规则之前讲过的。\"", "\"我记得，\"她说，\"买。\"", "\"对，买。\"", "斑马线是绿的，我们过去，拐进距离学校两个路口的那家连锁超市。", "自动门滑开，一股人工冷气扑出来，把外面积攒的那点热气拍了个正着。灯光白而均匀，把所有商品照成商业图册里的精修效果。塑料袋的摩擦声、广播里低音量循环的卖场背景乐、购物车轮子在地板上滚动的轱辘声，所有元素按照某种固定配方调和在一起，构成\"超市\"这个场所特有的听觉底色。", "洛灵梦在入口处停了一拍，把眼前这一大片用货架切割出来的商品丛林做了三秒的快速扫描，脸上是那种\"系统正在处理新场景数据\"的认真神情。", "\"很大，\"她说。", "\"嗯。\"", "\"比，外面，的摊子，大，很多。\"", "\"这就是之前说的'大了就是好'的实体呈现。\"", "她对这个说法显然没有异议，跟着我往蔬菜区走。一双眼睛往两边扫，不是乱逛，是那种做了大量前置信息收集之后进入新场景、系统性建立地图的状态——每走几步就往某个新冒出来的品类扫一眼，像是在进行某种悄无声息的区域标注。", "我在蔬菜区拿了一袋青椒，捏了一下，硬度合适，没有软包，放进篮子。", "\"那个，绿的，是什么？\"", "\"青椒，今天的主材料之一。\"", "\"吃起来，是什么，味道？\"", "\"微辣，带点脆，焦香的时候最好。\"", "\"你，会做，青椒，\"她停顿，思考，\"炒什么？\"", "\"青椒肉丝。猪肉、青椒、酱油，加盐，爆炒，盖在米饭上吃。\"", "洛灵梦沉默了一拍，然后非常平静地下了一个结论：\"比，味增汤，复杂。\"", "\"复杂一点，但不多。\"", "\"你，会做，吗？\"", "这个问题的发射角度精准命中了我刚才那套\"不过是输入-处理-输出\"自我说服体系的核心假设。我感到有必要在最短时间内把它按下去。", "\"会。\"我语气没有多余波动，把番茄拿起来翻了个面，选了两个颜色深一点的放进篮子，\"别小看资深胡闹厨房玩家的实操迁移能力。\"", "\"胡闹，厨房，是什么？\"", "\"一款烹饪游戏，电子的，不重要。\"我把话题截断，\"番茄这个你认识吧？\"", "她看了一眼篮子里那两个圆溜溜的红色物体，\"认识，红，的，可以吃，汁很多。\"", "\"正确。今天加番茄炒蛋，作为备用菜色，防止战略失误。\"", "\"战略，失误，是什么，意思？\"", "\"就是如果青椒肉丝翻车，至少还有一道保底，不至于今天晚上只能以泡面收尾。\"", "洛灵梦把这套风险对冲逻辑在脑子里处理了几秒，然后给出了一个相当严肃的评价：\"这是，好的，方案。\"", "来自一个把误差分析写进味增汤实验笔记里的理科天才的认证——我不确定这让我感到被肯定，还是只是有一点荒诞。", "我们往肉类区走，我拿了一块里脊，价格中规中矩，目测分量够用，没有多余的筋膜，是个及格的食材。旁边放着的是排骨，标价高出去一截，今天暂时不在服务范围之内，我无视它往前走。", "洛灵梦停在那排冰柜前，盯着玻璃后面各种被切割整理好的肉块看了四秒。", "\"这些，都是，动物，吗？\"", "\"是。\"", "\"它们，原来，什么样？\"", "我认真思考了一下这个问题的技术难度，在\"原始生物学科普课\"和\"把这个问题搁置\"之间做了一次快速抉择，最终理智胜出。", "\"回家以后如果你有需要，我可以找个纪录片给你看。但现在，这块是猪，今天的采购目标已经完成，我们去调料区。\"", "我们走到调味料区。面对一整面墙花花绿绿的瓶罐，我决定补一瓶生抽。家里目前只有洛灵梦从菜市场强行带回来的盐和味精，酱油这种高级道具向来不在我的泡面生存线配置里。", "\"你看这一排深色液体，\"我指着货架，语气不自觉地带上了一点高级玩家给新手做向导的游刃有余，\"这是中华料理的灵魂溶液。\"", "洛灵梦顺着我的手指看过去，眼神肃穆，仿佛在看什么危险化学品。", "\"它们分为生抽和老抽。生抽负责提升基础的咸鲜面板数据，老抽负责视觉附魔。今天我们只需要打底的生抽。\"", "\"附魔，是什么？\"她问。", "\"就是让一盘普通的肉丝拥有让人看着就想吃的光泽，俗称加滤镜。\"我在货架前扫视一圈，伸手拿下一瓶金标生抽，在手里抛了一下稳稳接住，\"就决定是你了，新手村性价比之王。\"", "洛灵梦看着我手里的瓶子，认真地点头：\"灵魂溶液，性价比，我记住了。\"", "看到她把这种中二设定当成真理一样录入数据库，我罕见地感到了一丝类似于\"恶作剧成功\"的愉悦感。我迅速把这点有点活跃过头的情绪掐灭，把生抽扔进篮子。我们转向收银台。", "排在前面的是个推着装满东西的大购物车的大叔，正在逐件往传送带上摆，速度缓慢，每拿一件都要思考一下放在哪里比较整齐，极具秩序感，但对后面的人而言等待时间相当于在做强制冥想。", "洛灵梦在我旁边站着，目光扫向旁边货架末端陈列的一排零食。那里摆着几包五颜六色的糖果，包装纸上印着卡通形象，彩度高得像是在用颜色直接向幼儿园儿童发起神经系统冲击。", "她看了几秒，没有伸手，只是看着。", "\"想要？\"我问。", "她把视线收回来，\"不，认识，那个，能吃，吗？\"", "\"糖，甜的，可以吃。\"", "\"甜，是什么，味道？\"", "我在心里飞速检索了一下如何向一个感知词库存在明显缺口的对象解释\"甜\"这个味觉形容词，最终选择了最直接的方案。", "\"买一包你试一下，比我解释更快。\"", "\"……买？\"", "\"对。\"", "她沉默了一拍，然后非常谨慎地伸手，从货架上拿了最下面那排的一包——橙色包装，里面装的看起来是水果夹心糖，价格标签上写着三块五。她把那包糖举起来，角度端正，仔细看了标签一眼。", "\"三块，五，\"她说，然后看向我，\"这个，是，一个数字，吗？\"", "\"是，代表它值三块五毛钱。\"", "\"钱，是，之前你，给过，我的，那个，吗？\"", "\"对，那个的一种。\"", "她把那包糖轻轻放进我的购物篮里，动作很慢，放稳了再松手，仿佛在执行某种需要精确落点的实验操作。", "\"我，买，这个。\"", "\"行。\"", "前面那个大叔终于完成了他的艺术装盘操作，收银员开始扫码，节奏重新流动起来。我把篮子里的东西放上传送带，一件一件往前推，洛灵梦站在旁边，把结账这整个流程从头到尾用纪录片观察员般的专注神情看了一遍，一声没吭。", "付完钱，购物袋递过来，我提上，往出口走。", "\"就这样，\"我说，\"这是超市。\"", "洛灵梦走在我旁边，把刚才那个完整流程在脑子里再过了一遍，然后下了结论：\"超市，比，摆摊，更，有秩序。\"", "\"对。\"", "\"但是，更大，容易，迷路。\"", "\"所以一般要记路，或者记货架位置，来多了自然就会。\"", "\"好，\"她点头，很认真，\"我，记住了。\"", "——她说这句话的语气，和\"今天的温度是二十一度\"落在同一个置信区间里，平静、确定，像是向某个内部数据库提交了一次成功的写入申请。", "我提着袋子往回走，云层压得更低了。风偶尔把路边树上的叶子吹动，发出沙沙的声音。空气里那股土腥气更浓了一点，雨大概真的快到了，但还差一口气，就这么悬在头顶，吊着。", "\"零，绮一，\"洛灵梦在我旁边开口。", "\"嗯。\"", "\"你，做饭，要，多久？\"", "\"青椒肉丝加番茄炒蛋，大概四十分钟左右，算上备料。\"", "她把这个数字在脑子里换算了一下，停顿了一拍，\"比，味增汤，快。\"", "我在心里毫无起伏地冷笑了一声。那是你做。你第一次做味增汤，从拆包装到查资料，再到量杯刻度精准校对，最后端到我面前，整整用了两个小时。两个小时，都够我打通一个独立游戏的试玩版了。", "但我没把这句吐槽扔她脸上，只是维持着表面的平稳：\"复杂度不同，你那个是第一次，我这个虽然平时只吃泡面，但在脑子里云演练过无数遍，理论熟练度不在一个层级。\"", "\"所以，只要，练习，我的，味增汤，也能，四十分钟。\"", "\"理论上。\"", "她点头，没有继续追问，步伐维持原速，安静地跟着走。", "回到家的时候，雨终于下来了。", "就那么零星几滴，打在窗玻璃上，颗粒感很清晰，然后风一吹，方向歪了，打在窗框边上，声音变小。不算大雨，只是那种酝酿了半个下午、最终只挤出来这点诚意的初秋小雨，矜持得有点小家子气。"]}, {"title": "第十七章 厨房攻防战与无法归档的感知残留", "body": ["我换了衣服，把食材拿出来摆在灶台边，洛灵梦换好家居服出来，在厨房门口站定，双臂垂在身侧，安静地看着我。", "那个站位是认真选过的——正好在门框这边，不进厨房主区域，也不堵着灯光，采光合适，视角清晰，能把灶台操作区看完整。如果不是她脸上那种\"我在进行实地考察\"的专注感，我几乎以为她是来摆姿势的。", "我拿起菜刀，回想着网上的教程，略显生硬地开始切里脊。", "\"为什么，要，切成这样，\"她问，声音控制得很轻，没有打断我小心翼翼的动作，\"之前，泡面里的，肉，是，薄片，的。\"", "\"工艺不同，用途不同，\"我紧紧盯着刀刃不敢分心，\"自己切是为了快熟、入味，泡面里那是工业脱水的产物，两种思路。\"", "\"明白了。\"", "\"你看仔细，教程上说刀和砧板的角度要对，顺着肌肉纹理切，不然容易散……虽然我现在切得比较像肉条。\"", "她真的往前倾了一点，把角度看清楚了，然后重新回到原来那个站位，一声不吭地记录。", "锅烧热，倒油。我站在离锅稍远的安全距离，深吸一口气，把青椒倒进去爆炒。铁锅和油接触的瞬间爆出来的声响，带着点烟气猛地往上冲，我下意识地往后缩了下脖子。烟气被抽油烟机吸走大半，剩下的散在厨房里，是正常炒菜该有的气味。", "\"那个，声音，\"洛灵梦开口，\"为什么，这么响？\"", "\"高温的油遇到水分，气化，就是这个声音。正常现象，不用担心。\"我强装镇定地握住锅铲。", "\"我，不担心，\"她说，\"只是，好奇。\"", "我侧过头看了她一眼，她还是那个姿势，站在门框那边，神情平静，异色的眼睛把锅里的动态从头到尾跟着看，认真到让人觉得她是在用某种内置的学习模块做实时录制。", "我把切得粗细不均的肉丝下锅，手忙脚乱地拿起生抽瓶子，凭感觉淋下去一点，赶紧加了一撮盐，铲子在锅里生硬地翻炒。动作完全谈不上行云流水，甚至有些手忙脚乱——手法极其生疏，属于那种\"脑子里知道步骤、但手完全跟不上趟\"的程度，和\"会做饭\"之间大概隔着十万八千里，全靠不把厨房炸了的底线在死撑。", "出锅，装盘，搁在灶台上。", "颜色勉强是对的，虽然肉丝厚薄不一，青椒也稍微有点焦边，但酱色和青绿的对比还在，至少没彻底炒糊。", "\"好了，\"我说，\"这是青椒肉丝，新手硬核版，勉强对得起一碗白米饭。\"", "洛灵梦的视线从那盘菜上移开，对上我，停了两秒。", "\"你，也，及格，了，吗？\"", "我把铲子放下，沉默了一拍。", "这个问题被她问出来的时候，语气完全是字面意思，没有任何调侃的成分——就是一个真诚的逻辑推导。既然我用\"及格\"评价了她的味增汤，那么用同样的标准衡量我的成果，是完全合理的操作。逻辑链里没有任何漏洞，我找不到反驳的角度。", "\"也许，\"我说，\"等你吃完再说。\"", "\"好。\"", "番茄炒蛋做起来比青椒肉丝快了将近十分钟，番茄出汁，鸡蛋被我炒得稍微碎了一点，但这道菜的容错率高很多，我有九成把握不会在这里彻底翻车。果然没有，出锅，装盘，卖相粗糙但勉强端正。", "两个人坐在餐桌边，米饭盛好，两道菜放在中间。窗外的小雨还在有一搭没一搭地打着，把这个不大的客厅衬得比平时安静了一点。", "洛灵梦先夹了一筷子青椒肉丝。", "她吃东西的时候一贯不声张，细嚼，安静，然后经过大概三秒的后处理，给出结论。", "\"好吃，\"她说，\"比泡面，好，很多。\"", "\"那个评价标准拉得有点低，\"我扒了口饭，\"泡面是工业品，这个是现做的，没可比性。\"", "\"那，和，味增汤，比呢？\"", "\"不同的菜，不能比。\"", "\"都是，你，评价，的，可以，比。\"她停顿了一下，逻辑链严丝合缝，\"味增汤，及格。这个，呢？\"", "我看了看那盘青椒肉丝。", "\"良。\"", "\"良，比，及格，好？\"", "\"好一档。\"", "她低头，又夹了一筷子，认真吃掉，再抬头：\"那，明天，我的，味增汤，也，要，到良。\"", "我没吭声。虽然我不确定她明天会不会继续在厨房里站上两个小时做精密实验，但我决定不在此刻发表看法。", "这句话是竞争，是陈述，还是某种只有她自己清楚的内部目标更新，我分辨不出来——而且我发现这三种解读在她身上大概本来就没有区别。对洛灵梦而言，目标就是目标，不携带任何社交附加层，说出来纯粹是因为这个结论在她的系统内完成了运算，就这么简单。", "我把番茄炒蛋夹了一筷子过去，推到她那边：\"先吃这个。\"", "\"为什么？\"", "\"番茄凉了口感会下降。\"", "她没有再问，夹了番茄炒蛋吃，眉头微微动了一下——不是皱眉，是某种细小的、信息接收成功的信号。", "\"酸，的，\"她说，\"但是，和甜，混在一起。\"", "\"对，就是这个味道。\"", "\"和，糖果，不一样，的，甜。\"她把今天在超市买的那包水果糖和眼前这道菜放在了同一个坐标轴上，做了某种微妙的风味校准，\"这个，更，真实，一点。\"", "\"真实这个词，你用得……挺准。\"", "我说这句话的时候，本来打算用一个更轻描淡写的语气收尾，但后半句话还是没来得及拦住，从嘴里出来了。", "洛灵梦没有追问这句话的含义，只是轻轻点了点头，继续吃饭。", "餐桌上两个人各自安静，偶尔筷子碰到碗沿，发出清脆的一声，和窗外的雨声掺在一起，莫名不吵，甚至有点——", "我把那个形容词掐死在破土而出之前，不给它任何发芽的机会。", "吃完饭，洛灵梦起身去收盘子，把碗叠起来，端到水槽边，动作比第一天稳多了，没有再失手，流程执行得相当利索，甚至比某些声称\"会做家务\"的普通人更干净利落。", "我在旁边把剩下的菜用保鲜膜盖好，放进冰箱。", "\"零，绮一，\"她背对着我，在水槽前，水声里开口，\"你，今天，做饭，很，认真。\"", "\"买了菜不做是浪费。\"", "\"不是，那个意思，\"她停了一拍，语气里没有任何情绪的起伏，只是像陈述一个已经确认的事实，\"我，是说，我，看见，了。\"", "水声均匀地继续，洗碗的动作没有停。", "我站在冰箱边，把手从门把上松开，没有立刻说什么。厨房的暖黄灯光打在她背上，白色家居服的轮廓清晰，发尾因为低头的幅度往前滑了一缕，她没去管它，专心对着水槽，一只碗一只碗地冲干净，叠进碗架。", "\"随便，\"我最终开口，语气压得很平，\"早点洗完，别把袖子弄湿。\"", "\"上午，就，湿了，\"她说，\"没关系。\"", "\"今天晚上的不一样，外面在下雨，凉。\"", "她没有说话，但手边的袖子确实往上撸了一截。", "我转回去，把厨房的抽油烟机关了，检查了一遍炉灶是否关好——关好的，这件事我每次都会做，已经是收尾清单里的固定选项，和她在不在厨房没有关系，纯粹是习惯使然。", "最起码，我是这么和自己说的。", "窗外的雨还没停，细细的，绵延，落在玻璃上的声音稀稀落落，像某种轻描淡写的背景音效，不喧宾夺主，就是在那边不声不响地维持着存在感。", "我坐回到沙发上，拿起手机，屏幕亮起来，通知栏几条学习群的消息，扫了一眼，没什么值得打开的，顺手锁屏。", "然后，在我本来打算就这么进入低功耗模式的时候，脑子里忽然弹出一条没来得及归档的游离信息。", "她说，她看见了。", "我只是在厨房里把两道普通家常菜从原材料推进到成品阶段，没有任何超出常规操作的步骤，甚至整个过程我内部运行的主要逻辑是\"不能输给一碗两小时做出来的量杯味增汤\"——这套动机说出来寒碜得要命，根本不值得被任何人记录在案。", "但她说，她看见了。", "不是\"好吃不好吃\"，不是\"下次还做不做\"，是\"认真\"，是\"我看见了\"。", "这两个词落在一起，以一种我没有预料到的角度，准确地打中了某个我平时不会刻意留意的位置，像是被人用指节不轻不重地敲了一下——你还没来得及确认痛不痛，那只手已经收回去了。", "我把这件事在脑子里全选，找到\"回收站\"图标，拖进去。", "发现没拖进去。", "又试了一次。", "还是在原地。", "我盯着天花板，进行了大约五秒的沉默内部审计，最终诊断结果是：本机在今日十九时三十分左右，出现了一次无法通过常规手段完成归档的感知残留，原因不明，影响范围尚在可控边界以内，建议关机重启。", "洛灵梦从厨房出来，把手在衣服上擦了擦，在沙发另一头坐下，从茶几上把那包水果糖拿过来，拆开，摸索出一颗，放进嘴里。", "嚼了两口，停了一下。", "\"甜，\"她说，语气里带着某种初次核验成功的确定感。", "然后侧过头，把糖袋往我这边推了推，\"你，也，吃，吗？\""]}, {"title": "第十八章 我打外卖？真的假的？", "body": ["第二天早上，我是被厨房的动静吵醒的。", "不是什么很响的声音，就是那种刀搭在砧板上、锅盖轻轻碰了一下炉灶边缘的声音，稀稀落落的，有规律，像某种精密仪器在低频运转。", "我看了一眼手机，七点零三分。", "然后我就听到了她在厨房小声念东西的声音。", "\"……第四步，加味噌，水温，不，能，超过，八十度……\"", "我盯着天花板，沉默了大约五秒，得出结论：她昨晚大概把菜谱又重新看了一遍，然后今天早上以复盘优化的心态重新开始了她的实验。", "一个在昨晚睡前更新了任务目标的系统，今天就已经在执行新版本了。", "我在被子里又躺了一会儿，最终还是爬起来了——不完全是因为饿，更多是因为那种\"一个人在厨房里独自念操作手册\"的画面让我有一种说不清楚的、轻微的、不想让它继续的感觉。", "我洗了把脸，走出去，在厨房门口站定。", "洛灵梦听见动静，侧过头看了我一眼，然后重新看回锅里，语气平静：\"还，有，十二分钟。\"", "\"我没问。\"", "\"我，知道，你，没问，\"她说，\"但是，你，看了，手机。\"", "我把她这套逻辑链在脑子里过了一遍，发现反驳不了，就算了，去倒了杯水，靠在冰箱边上等。", "今天厨房的气味正常一些，是味噌该有的发酵香气，不是昨天那种什么东西混在一起的复杂气味。锅里的温度控制得比上次稳，她没有开大火——这一点上她有明显进步，上次的大火是让汤底出问题的主要原因之一。", "但是。", "豆腐。", "我看着她把豆腐从盒子里取出来，然后——拿出了一把小尺子。", "等等，为什么厨房里会出现文具？这是准备在豆腐上进行什么精密的微雕艺术吗？", "她认真地在豆腐上比划了一下，确认切割位置，然后才下刀。", "\"你在量豆腐？\"我拼尽全力控制自己不要扯着嘴角。", "\"菜谱，上说，一厘米，见方。\"她语气平静，\"上次，切，得，不准确，所以，汤，里面，的，豆腐，口感，不统一。\"", "我看着那几块被她切得整整齐齐、误差大概不超过两毫米的豆腐，沉默了一下。", "\"洛灵梦。\"", "\"嗯。\"", "\"你是不是有点走偏了。\"", "她停下来，把尺子放在砧板边上，认真看着我，\"哪里，偏了？\"", "\"豆腐不用量，差不多就行，你能感觉到的。\"", "她盯着那几块豆腐，盯了大概三秒，然后用一种很诚实的语气说：\"我，感觉，不到，差不多。\"", "我一时找不到什么反驳的角度，就没再说话。", "好吧，那就量吧。", "十二分钟后，味噌汤端上来了，和昨天一样摆在桌上，热气平稳，没有上次那种莫名其妙的颜色偏差。", "我喝了一口。", "比昨天好。不算大幅度的提升，但某些地方稳了——豆腐的熟度比上次均匀，汤底没有过度煮沸的苦涩味，味噌的比例也更接近那个应该有的咸鲜平衡。", "\"怎么，样？\"她在对面坐下，双手放在桌上，姿势端正，等待评估结果。", "\"及格，\"我说，\"和上次一样。\"", "她没有说话，低下头，在手机的备忘录里记了什么。", "\"记什么？\"我问。", "\"记，哪里，还要，改。\"她抬起头，\"豆腐，下次，不量，用手感。长葱，要，更早，放。火，还要，再小，一点。\"", "我把这几条改进方向在脑子里过了一遍，发现她的诊断都是对的，精准到有点令人惊讶。", "\"你自己喝了吗？\"", "\"喝了，\"她说，然后停顿了一下，\"我，觉得，也，及格。\"", "\"自评及格，他评及格，目标是良。\"", "\"嗯。\"", "\"那你大概还需要几次。\"", "\"不知道，\"她说，语气里没有任何焦虑，只是陈述，\"但是，每次，会，好一点，的。\"", "我看着她把碗端起来，安静地喝汤，晨光从窗帘缝里透进来一条，落在她的侧脸上。她专注地低着头，异色的眼睛对着碗里，那双眼睛安静的时候格外沉。", "我把视线移开，看向窗外。", "今天天气是好的，昨晚那场矜持的小雨把空气洗了一遍，现在外面是初秋难得的清透，云压得不高，但薄，透光。", "……", "晚上我煮了泡面。", "不是不想吃别的，是泡面快，操作成本低，而且冰箱里昨天剩的青椒肉丝已经在中午被我带便当吃掉了，懒得再买菜。", "洛灵梦端着她自己的碗坐在沙发上，碗里是白米饭加咸蛋，不知道什么时候备的，我没问。", "两个人各自吃各自的，电视开着，播的是什么自然纪录片，画面是非洲草原，解说词低沉，介绍某种羚羊的迁徙路线。", "洛灵梦认真地看了一会儿，然后开口。", "\"它们，为什么，要，走那么，远？\"", "\"追水源，追草，季节变了，原来的地方活不下去了，就走。\"", "\"如果，不走，呢？\"", "\"死。\"", "她点了点头，把这个信息收录进去，重新看回屏幕。", "我把泡面的汤喝了一口，有点咸，放下筷子。", "沙发上安静了一段时间，纪录片里羚羊群越过河流，解说词说这一段迁徙每年都有折损，但种群会继续往前走。", "洛灵梦把碗放下，用一种陈述天气预报的语气开口。", "\"零，绮一。\"", "\"嗯。\"", "\"想吃，青椒肉丝。\"", "我把泡面碗放下，拿起手机，打开外卖软件，搜索\"青椒肉丝\"，选了距离最近、评分凑合、配送费不离谱的那家，加入购物车，付款，下单，预计送达三十二分钟。", "全程大概用了四十五秒。", "洛灵梦全程看着我，等我把手机放回茶几，她开口了。", "\"你，在，做什么？\"", "\"点外卖。\"", "\"外卖，是什么？\"", "\"就是有人帮你把你想吃的东西做好，然后送过来，你付钱，坐在家里等就行。\"", "她把这套机制在脑子里处理了几秒，眼神里浮现出一种非常罕见的、接近于惊讶的神情，那双异色的眼睛微微睁大了一点点，就像一个严谨的科研人员发现实验结果比预期多出来了一个数量级。", "\"有，这种，东西？\"", "\"有，而且很普遍，你之前没见过吗？\"", "\"没有，\"她说，语气平静，但眼神还没完全从惊讶里回来，\"所以，我想吃，什么，都可以，有人，送来？\"", "\"理论上是的，只要有人做，只要你付得起钱。\"", "她沉默了大约五秒，用一种郑重其事的表情点了点头，像是完成了一次重要的世界观更新。", "\"明白了。\"", "我重新拿起筷子，把剩下的泡面解决掉。", "三十一分钟后，门铃响了。", "我去开门，外卖小哥把袋子递过来，我道了声谢，关上门，把袋子拎回来放在茶几上。青椒肉丝装在一次性餐盒里，还有热气，隔着袋子都能闻到酱香味。", "洛灵梦已经端正地坐在沙发上等着了，腰背挺直，就差举手说\"我准备好了\"。", "我把餐盒打开，推到她那边，筷子递过去。", "她夹了一筷子，放进嘴里，咀嚼，后处理，沉默。", "然后，是比平时多出来半拍的停顿。", "\"怎么了？\"我问。", "\"没有，\"她说，\"只是，在，想，一件事。\"", "\"什么事。\"", "\"和，昨天，的，不一样。\"她用一种非常客观的语气下了结论，\"昨天，的，更好吃。\"", "我看了一眼那盒外卖青椒肉丝。卖相不错，酱色均匀，青椒保持了翠绿，摆盘整洁，一看就是做过几百盒的熟练工。", "然后我看了一眼昨天自己做的那盘——当然，那盘早就进了我的便当盒，但我记得，肉丝厚薄不一，青椒有两块焦边，摆盘约等于没有摆盘，往白米饭上一盖，活像个灾后现场。", "外卖这家店评分四点七，月销过千，专业后厨，工业调味，火候精准，标准化生产，这是我一个第一次开真火炒菜的手残能比得过的吗？", "这中间的差距，客观上讲，不是\"好吃\"和\"不好吃\"的问题，是工业精度和新手试错之间的本质差异，任何一个有正常判断力的人都应该得出同样的结论——", "我打住了这条逻辑链。", "算了。", "这是我的好球区。"]}, {"title": "第十九章 两周败绩与蹲守成功的概率论", "body": ["放学的时候，我照例在校门口等。", "这件事我从来没有跟任何人解释过，也不打算解释。洛灵梦从A区出来，我从平行班区出来，两个方向在校门口有一个自然的交汇点，在那里等是路线最优解，没有其他含义，就这样。", "我靠在门柱边上，书包挂在肩上，看着放学的人流往外涌。", "然后脑子没什么正事可想，就飘回去了。", "两周。", "我在M市中学就读了将近一个月，其中有两周，我处于一种可以被客观描述为\"在学习\"的状态——洛灵梦每天晚上饭后在桌边坐下来，翻开我的课本，然后用她那套独特的讲法开始输出。", "说\"独特\"，其实是在委婉地表达\"我有时候跟不上\"。", "她讲题的方式是跳跃的。不是那种\"稍微跳过了几步\"的跳跃，是\"中间省略了我整个初中三年应该掌握的知识体系\"的跳跃。她站在大学四年级的视角往下看，觉得高中内容触手可及，随手就能捏出来讲给我听——问题在于我站在平行班走后门生的视角往上看，中间隔着的那段距离，在我这边叫做\"悬崖\"。", "结论是什么，我大概听懂了八成。", "过程是怎么来的，我能跟上五成。", "如果月考真的按这个吸收率来，我不确定\"全校前三百\"是不是一个我能够得着的数字。校长当时说这句话的时候，脸上是那种\"这是底线不是目标\"的表情，我对这种表情的解读能力还算在线。", "我在心里把几个主科的现状过了一遍，得出的结论大概是：数学是主要雷区，洛灵梦讲数学的时候跳得最狠，有两个章节我现在背得出公式但推不出过程，这种状态放到考场上和不会没有本质区别。语文问题不大，语文这种东西靠的是语感，是我目前唯一的安全区。英语中等，物理化学跟着洛灵梦学，概念层面是清楚的，但题型变一变我不保证能认出来。", "综合评估：岌岌可危，但还没到放弃治疗的程度。", "我需要找到一个能让我把那些\"知道结论但不知道过程\"的漏洞补上来的方法，但我还没想好是什么方法，所以这件事目前处于挂起状态，等待后续处理。", "正在挂起的时候，洛灵梦出现了。", "她从A区方向走过来，步伐平稳，书包背得端正，茶色长发在傍晚的光里飘了一下。我从门柱边上直起身，正准备走——", "\"零绮一！\"", "这个声音不是洛灵梦的。", "我转过头，看到了夏露可。", "她站在校门口人流的边缘，表情是那种憋了很久终于找到出口的复杂神情，头发有点乱，显然是刚从教室方向跑过来的。", "我在脑子里迅速检索了一下：夏露可，A1班长，洛灵梦的自封保护者。上次在校长办公室见过，之后没有任何交集。", "她怎么在这里？", "这个问题还没想完，她已经开口了。", "\"站住！\"", "\"我在走路，\"我说，\"又没有撞到你。\"", "\"我每次处理完班里的事出来，你们就已经不见了！\"她指着我，语气里压着两个星期的憋屈，\"今天我提前把事情交代出去，就是专门来堵你的！\"", "我把这段信息在脑子里过了一遍，迅速拼出了一个大致的图景——她这两周一直在试，每次被班长的琐事绊住脚，等她出来，人已经走了。", "两个星期，次次扑空，今天终于堵到了。", "我在心里给她评了个\"执行力满分，时机选择减分\"，然后走到洛灵梦旁边站定。", "洛灵梦看了夏露可一眼，然后看向我，语气平静：\"夏露可，来了。\"", "\"嗯，\"我说，\"她今天成功了。\"", "\"成功，什么？\"", "\"堵到我们。\"", "洛灵梦把这个信息处理了一秒，然后非常平静地转向夏露可，偏了偏头：\"你，要，一起，走，吗？\"", "夏露可大概没有预料到这个问法。她准备好的是质问，是对峙，是把洛灵梦从零绮一身边\"救\"出来——不是被洛灵梦本人用这种语气邀请同行。", "她站在原地愣了两秒，然后硬撑着点了头：\"我要跟着去看看你们住的地方。\"", "\"好，\"洛灵梦说，然后继续往前走，就好像这件事已经完全解决了。", "我跟上去，夏露可跟在后面，三个人就这么往出租屋方向走。", "平静了大概三十秒。", "\"你们同居多久了。\"夏露可从后面开口，语气是审讯风格。", "\"开学第一天，\"我说，\"算起来快一个月。\"", "\"一个月，\"她重复了一下，语气里有股憋着的劲，\"洛灵梦，你当时怎么想的，就这么跟他住在一起——\"", "\"住，\"洛灵梦平静地说，\"因为，答应了，要做，味增汤。\"", "夏露可停顿了一秒，\"什么？\"", "\"味增汤，\"洛灵梦重复，语气里没有任何觉得这个理由有什么问题的意思，\"每天早上，要做。\"", "\"我说的不是味增汤，\"夏露可的声调上去了一点，\"我是说你为什么要住在他家里，这两件事有什么关系——\"", "\"有关系，\"洛灵梦说，\"住在一起，才能，每天早上，做。\"", "夏露可的嘴动了一下，想说什么，但洛灵梦这套逻辑链在字面上是完全自洽的，她一时找不到从哪里切入。", "我在前面走着，没有回头，但嘴角动了一下。", "\"那你，\"夏露可调整了一下方向，转向我，\"你当时为什么答应让她住进来，你们才认识多久——\"", "\"我没答应，\"我说。", "\"什么？\"", "\"我第二天早上起来，她已经在我厨房里了，\"我说，\"你问我答没答应，我连她什么时候进来的都不知道。\"", "夏露可转向洛灵梦，\"你是怎么进去的——\"", "\"零绮一，\"洛灵梦平静地说，\"之前，说过，每天早上，做味增汤。\"", "\"他什么时候说的！\"", "\"田野里，\"洛灵梦想了一秒，\"他，跪下来，说的。\"", "夏露可的视线缓缓移回我身上。", "\"我中暑了，\"我说，\"神志不清。\"", "\"你跪下来求她做味增汤。\"", "\"我说了，神志不清。\"", "夏露可停下脚步，站在原地，表情是那种被一连串完全无懈可击的荒诞信息砸中之后短暂当机的神情。", "我已经走出去了几步，回头看了一眼，\"走了，还有两个路口。\"", "她深吸一口气，跟上来，这之后沉默了将近一整条街，大概是在重新整理她的进攻逻辑。", "我在心里给今天的状况做了一次评级：麻烦，但可控。", "……", "出租屋不大，三个人进去之后，空间感肉眼可见地缩水了。", "夏露可进门就开始打量，目光在客厅、厨房、两个房间的门之间来回扫，是那种专门在找问题的眼神。我把书包扔在沙发上，在旁边坐下，随她看。", "\"只有一个客厅？\"她问。", "\"不然呢，\"我说，\"这里是出租屋，不是别墅。\"", "\"你们两个住在这里，\"她顿了一下，措辞了一下，\"房间是分开的？\"", "\"这个问题，\"我说，\"如果你是以洛灵梦朋友的身份在关心她的居住条件，我可以告诉你是分开的，她住里间，我住外间，门锁好的。如果你是在试图构建某种不存在的问题，那这个问题我没兴趣回答。\"", "夏露可盯着我，像是要说什么，最终没说。", "洛灵梦换了家居服出来，在桌边坐下，从书包里拿出课本，翻到某一页，放在桌上，然后抬头看向我。", "\"零，绮一，坐过来。\"", "我看了一眼夏露可，她也在看我，表情是\"你敢过去试试\"。", "我站起来，在洛灵梦旁边坐下，把自己的课本也拿出来。", "夏露可在客厅另一端找了个位置坐下，抱着胳膊，摆出一副监工的架势。", "洛灵梦没有理会她，翻开我的数学课本，指着上面一道例题。", "\"这个，上次，没讲完，\"她说，\"从这里，继续。\"", "\"好。\"", "我拿起笔，瞥了一眼对面。", "夏露可纹丝不动，目光在我和洛灵梦之间来回，准备把接下来的每一秒都收入眼底。", "行吧。", "那就让她看。"]}, {"title": "第二十章 监工、漏洞与不甘心的撤退", "body": ["洛灵梦开始讲，一如既往地跳脱。", "第一步到第四步之间有一段她认为\"显然\"的推导，用了三个我能认出来但串不起来的公式，结论直接出来了，她在本子上写下来，用笔尖点了两下，示意我应该跟上了。", "我盯着那行字，在脑子里试图把中间的步骤还原出来，还原了一半就卡住了。", "我低下头，在草稿纸上写了两行，发现方向不对，划掉，重新来，写到一半又卡住。洛灵梦在旁边安静地等，没有催，但也没有主动补充我卡住的那个地方——因为她大概真的不觉得那个地方有什么好卡的。", "这个状态持续了大概三分钟。", "\"你，写什么，\"洛灵梦低头看了一眼我的草稿纸，\"那步，不需要，展开。\"", "\"我需要展开，\"我说。", "\"为什么？\"", "\"因为我不知道它为什么成立。\"", "她停了一下，把那个步骤在脑子里过了一遍，然后用一种\"这也需要解释\"的表情看着我，但还是重新拿起笔，开始把那段推导补出来。", "夏露可在对面全程看着，一声没吭。", "我没有回头，但我感觉到她的视线一直在——不是那种找茬的盯梢，是真的在看，认真的那种。", "洛灵梦把补充的推导写完，我把过程看了一遍，这次跟上了，把结论抄下来，在旁边加了几行注释。", "\"好了，\"洛灵梦说，\"下一题。\"", "这时候夏露可站起来了。", "不是来找我的，她绕过桌子，在洛灵梦旁边蹲下来，语气一下子变了，变得很轻，\"洛灵梦，你还好吗？吃得好睡得好吗？\"", "洛灵梦偏了偏头，看着她，\"好。\"", "\"有没有什么不方便的地方，\"夏露可继续说，\"或者你想要什么，想去哪里，你告诉我，我来帮你——\"", "\"现在，\"洛灵梦想了一秒，\"想，继续，讲题。\"", "夏露可的话卡了一下，\"……我是说生活上的事。\"", "\"生活，\"洛灵梦平静地重复，\"零绮一，负责。\"", "夏露可抿了抿嘴，扭过头看了我一眼，那眼神里有一百句话，但当着洛灵梦的面，她一句都没说出来，重新转回去，声音放得很软，\"那你开心吗？住在这里。\"", "洛灵梦想了大约三秒，\"开心，是，什么，感觉？\"", "夏露可愣住了。", "我在旁边假装低头看课本。", "\"就是，\"夏露可停顿了一下，重新组织语言，\"你喜欢待在这里吗？\"", "\"喜欢，\"洛灵梦说，语气里没有任何犹豫，\"零绮一，会给我，好吃的。\"", "这个回答显然不是夏露可想要的，但她也找不到任何反驳的角度——洛灵梦说喜欢，说得毫无保留，毫不迟疑。", "夏露可站起来，在洛灵梦头顶停了一下，像是想说什么，最终轻轻拍了拍她的肩膀，没有说话。", "然后她拎起书包，往门口走。", "走到门口，她停下来，回过头看着我，\"出来一下。\"", "我放下笔站起来，跟她走到门外，把门带上留了条缝。", "夏露可站在走廊里，抱着胳膊，看着我，沉默了两秒，像是在考虑要不要说。", "最终还是说了，语气很平，\"我看了你刚才做题，你能背结论，但推过程每次都要停很久。月考不会给你时间停的。\"", "我没说话。", "\"洛灵梦教的是她自己的逻辑，\"她说，\"对她来说那些步骤是显然的，但省掉的那些地方，高考全都要考。这套方法，可能不适合你，你自己想想。\"", "走廊里安静，楼道灯把她的影子打在墙上。", "我靠着门框，看了她一眼，\"你为什么要告诉我这个。\"", "夏露可皱了皱眉，\"我是为了洛灵梦，\"她说，\"如果你月考没过线，对她也没好处。\"", "\"嗯，\"我说，\"知道了。\"", "她盯着我看了两秒，像是在判断我是不是在敷衍，然后冷哼了一声，\"我会盯着的，洛灵梦出任何问题，我找你。\"", "\"随时来，\"我说，\"下次不用在校门口站那么久，直接来就行。\"", "她瞪了我一眼，转身走了，脚步声在楼道里渐渐消失。", "我站了一会儿，重新推开门进去。", "洛灵梦抬起头，看了我一眼，\"说，什么了？\"", "\"没什么，\"我说，在桌边坐下，把课本拉回来，\"她说你讲题跳太快，让我自己想想。\"", "洛灵梦低头看了一眼本子，沉默了一拍，然后重新拿起笔，在刚才那道题下面又写了几行——是她之前略过的那段推导，写得比刚才更细，每一步都有标注，写完推过来，没有说话。", "我看了看那页纸。", "\"谢了，\"我说。", "\"不用，\"她说，\"下一题。\"", "客厅重新安静下来，只有笔在纸上划过的声音。", "我低下头，在草稿纸上重新把刚才那道题从头推了一遍，自己来，不看注释，一行一行往下写，把每个之前不确定的地方全部展开，直到最后一行结论出来，和洛灵梦写的那个一模一样。", "我盯着那行字看了两秒。", "\"对，\"洛灵梦说。", "\"嗯，\"我把草稿纸翻面，\"下一题。\""]}, {"title": "第二十一章 食材采购与不必要的观察记录", "body": ["放学之后，我多绕了半条街。", "原因很简单：昨天的外卖青椒肉丝被她评价成\"没有你做的好吃\"，这件事以一种我至今没完全理清楚的方式，在过去二十四小时里持续占用了我一定比例的后台运算资源。", "我不接受这个。", "逻辑上讲，这个结论是有问题的。那家外卖店月销过千，我第一次开灶，中间的差距不是\"好不好吃\"的问题，是经验基数的问题，是工业精度和新手试错的本质差距。她说\"昨天的更好吃\"，这句话理论上应该被归类为\"判断依据不充分、参照系不规范、结论可信度存疑\"，然后进回收站。", "但它没进回收站。", "所以今晚我打算再做一次。", "理由是食材有剩，冰箱有空间，多做一次是正常的资源利用行为，和那句话没有任何关系。", "这套自我解释说出来之后，我发现它在逻辑上没有任何漏洞，所以就这样了。", "\"今天，要去，哪里？\"", "洛灵梦在我旁边走，步伐和我保持同步，书包挂在肩上，茶色长发被傍晚的风推着偏了一点，她用手把它押回去，按住，放开，它又飘了，她没有再管它。", "\"菜市场，\"我说，\"超市的菜贵，菜市场的比较新鲜。\"", "她点头，像是在记录一条新的知识条目，\"超市，贵，菜市场，新鲜。\"", "\"差不多。\"", "\"那为什么，上次，去，超市？\"", "\"超市卖的东西更全，你第一次见，一起逛更方便，\"我说，\"菜市场东西多但是杂，不适合第一次。\"", "她把这个区别认真消化了一下，然后用一种陈述性的语气下了结论：\"所以，上次，是，给我，准备的，路线。\"", "我没说话。", "因为她说得对，我没有什么可反驳的。", "这件事本身没什么，我只是做了一个路线选择，就是这样，不值得被单独拿出来说。", "但她把它说出来的方式，是那种平静的、没有任何试探成分的陈述，就像在说\"今天天气是二十三度\"，理所当然地确认一个已经发生的事实——这让我找不到任何接口用来把这件事归档进\"无关紧要\"的文件夹里。", "\"走了，\"我说，\"快点，晚市快收摊了。\"", "---", "菜市场在一条窄巷子里，傍晚时分还有最后一波客流，摊贩们的吆喝声和讨价还价的声音混在一起，空气里是蔬菜、生鱼和地面潮湿混合出来的那种气味，浓度恰到好处，是真实的市井气，不是什么精心设计的氛围感。", "洛灵梦进了巷子，立刻慢下来。", "不是因为人多，她对人多没有特别的反应，上次超市里人比这多，她全程保持了稳定的观察员状态。这次慢下来，是因为她开始用她的纪录片模式逐一扫描两侧的摊位。", "蔬菜区，水产区，豆腐摊，卖鸡蛋的大叔，对着什么都要看上两秒，把眼神打过去再收回来，继续往前。", "\"和，超市，\"她说，\"不一样，的，陈列，方式。\"", "\"超市有货架，这里直接铺在摊上，形式不同，\"我说，\"走了，今天要买里脊、青椒，还有豆腐，你记一下。\"", "\"记住了。\"", "\"那就找，里脊是猪肉摊的东西，一般在——\"", "我还没说完，她已经走到旁边一个卖猪肉的摊子前，站定，用她那双平静的异色眼睛把摊子上的东西过了一遍，然后开口，语气毫无波动，\"里脊，在哪里？\"", "摊主是个中年男人，正在收拾案板，被她这一声问得一愣，随即笑了笑，指了指右边挂着的那块肉，\"小姑娘，这是，要多少？\"", "洛灵梦回过头看我。", "\"三百克，\"我说，\"差不多就行。\"", "她转回去，\"三百克。\"", "我站在摊子边，看着摊主切肉，称重，用塑料袋装好，递过来，我接过来付钱。全程洛灵梦站在旁边，把每一个步骤看得一清二楚，包括摊主怎么用那把铁钩子把猪肉从挂钩上拿下来，怎么落刀，怎么用秤。", "等我把袋子拎起来走人，她跟上来，\"他，切肉，和你，切肉，刀，不一样。\"", "\"他的是专业用的，我用的是普通菜刀，\"我说，\"用途不同，刀型也不一样。\"", "\"那个刀，\"她想了一下，\"比你，那把，更顺。\"", "\"对，重心和弧度都是按猪肉那个硬度设计的，你拿我那把菜刀去切同样的东西，当然差。\"", "她点头，在脑子里把这条信息写进去，归档，然后往前走两步，停在豆腐摊前，自己问了，\"豆腐，多少钱一块？\"", "我在后面站着，看着她和豆腐摊的老太太谈完，把豆腐放进我拎着的购物袋里，全程我没有开口。", "然后她往前走，没有停，在青椒摊前站定，挑了几根，凑过来，\"这个，够吗？\"", "\"再加两根，\"我说，\"多炒一点，今天菜少。\"", "她重新走过去，又拿了两根，付钱，回来，把袋子里的青椒整理了一下，使它们不压着豆腐。", "这个动作做得很自然，手速不快，但不慌乱，像是她已经在脑子里把\"不能压豆腐\"这条规则提前算进去了，所以手一伸进去就知道应该往哪里放。", "我把购物袋拎上，往出口走。", "\"零，绮一，\"她在旁边开口。", "\"嗯。\"", "\"这里，的，豆腐，\"她想了一下，\"比超市的，多，很多，种类。\"", "\"市场的货品流通快，种类也多，\"我说，\"你喜欢哪种豆腐？\"", "她停了一步，仿佛这个问题落在了一个她从来没打开过的抽屉上，想了一会儿，然后认真地回答，\"不知道，没，比较，过。\"", "\"那下次多买两种回来，自己对比。\"", "\"好。\"", "---", "回去的路上，天已经开始压色了，不是黑，是那种深蓝往橙黄过渡的分层感，云边被打上了一点暖光，看起来比实际上精致一点。", "洛灵梦走在我右边，书包的带子被她捏在手里，没有背，只是拎着，因为要腾出手来，偶尔往购物袋里看一眼，确认豆腐还在、青椒没有漏出来。", "她这个动作做了三次，每次间隔大概一百米。", "我没有说\"你不用一直检查\"，因为她这不是焦虑，这是她习惯性的状态确认，和她在课本上看完一道例题之后重新翻回来对照一遍是同一种底层逻辑。", "过了一个路口，她忽然开口，\"零绮一，今天，做，什么菜？\"", "\"青椒肉丝，\"我说，\"可能再加个番茄蛋汤。\"", "她把这两个菜的名字在脑子里放了一下，没有说话，停了两秒，然后说，\"还是，这两个。\"", "\"有什么问题吗？\"", "\"没有，\"她说，\"好吃，就，可以，一直，吃。\"", "我把这个逻辑在脑子里过了一遍，发现它简单到几乎没有什么可以解构的余地，就没有说话。", "但\"好吃，就可以一直吃\"这句话，它停留在脑子里的时间比它应该停留的时间长了一点。", "我在心里清了清喉咙，找到了另一个解读角度：从食材采购效率的角度来看，固定菜单可以减少采购决策成本，提高流程标准化程度，是一种非常理性的系统化思维，这说明她在某些层面上是有相当程度的效率意识的——", "这套分析说完，我发现它听起来有点像是在绕弯子。", "算了。", "菜市场出来再走三个路口，就到出租屋了。", "我把购物袋从左手换到右手，走了两步，洛灵梦忽然停下来，蹲在路边，我跟着停，往下看。", "地上有一只猫，花色，脏了些，不算瘦，正用一种对整个世界都漠不关心的神情蹲在墙根边上，对我们的出现没有任何反应。", "洛灵梦盯着它，把它从头到尾看了一遍，然后伸出手，停在空中，没有往前。", "\"可以，碰，吗？\"她问，但明显不是在问我，是在问某个内部的判断机制。", "\"流浪猫不一定让陌生人摸，\"我说，\"你直接放着不动，看它什么反应。\"", "她把手放下来，蹲在原地，保持不动，看着那只猫。", "那只猫瞄了她一眼，没有走，重新把眼睛闭上了。", "洛灵梦盯着它又看了十几秒，然后站起来，继续走，语气里带着某种已经完成了一次观察记录的平静，\"它，不在意，我们。\"", "\"对它来说这条街上每天有很多人，\"我说，\"你不给它东西吃，它不会特别注意你。\"", "\"那，如果，给它，吃的，呢？\"", "\"它可能会记住你。\"", "她把这个因果关系在脑子里归了一下档，点头，走了几步，忽然说，\"下次，带，吃的。\"", "\"随你，\"我说，\"别带味增汤，猫不喝那个。\"", "她想了一下，\"那带，什么？\"", "\"猫粮，或者鸡胸肉，超市里有卖的，\"我停了一下，\"下次超市记得看一眼，货架在熟食区附近。\"", "\"好，\"她说，\"我，记住了。\"", "这句话落下来，语气里还是那种平静的确定，像是向内部数据库提交了一次成功的写入申请，完成，关闭，继续往前走。", "我把购物袋重新换回左手，往出租屋方向走。", "晚风把路边那棵树的叶子推动了一下，发出沙沙的声音，洛灵梦侧过头看了一眼那棵树，然后重新看回前方，两个人继续走。", "路灯亮起来了。", "不知道是哪一盏先亮的，等我注意到的时候，前方那条街已经全亮了，橙黄色的光把傍晚的最后一点蓝色盖住了一半，地面上出现了很长的影子。", "洛灵梦的影子落在我影子左边，步伐平稳，各走各的，在地上交叠了一点点，随着走动分开，再交叠，再分开。", "我看了那一下，很快移开视线，没有继续看。", "这件事不值得被记录。", "我是这么决定的。"]}, {"title": "第二十二章 零绮一的料理革命（继续升级未遂）", "body": ["我换了衣服，把购物袋里的东西一样一样拿出来摆在灶台上。", "里脊、青椒、豆腐、番茄、鸡蛋，以及一小包金针菇——那是洛灵梦在菜市场出口处多看了两眼，我就顺手拿回来的。不是需要，是顺手，不存在什么特别的解释。", "洛灵梦照旧在厨房门口站着，位置和上次一模一样，双臂自然垂在身侧，姿态端正，像是一台刚完成系统启动的监控终端，正在等待任务数据传入。", "“你今天可以不用站这里。”", "“为什么？”", "“因为今天没有新流程，和昨天是一样的菜色。”", "她认真想了一下，然后把身体往门框上靠了靠，调整到一个更稳定的站姿：“那，我，记录，变量。”", "“什么变量？”", "“你，的，熟练度。”", "我没有接这话，把围裙系上——这条围裙是昨天从超市顺手拿的，深灰色，上面印着某家调味料品牌的logo，设计平庸，但至少比直接穿着校服炒菜要少洗一件衣服。", "系围裙的时候，我感到她的视线投过来，在我背后停留了一拍。", "没有开口，没有发问，就是看着。", "我把里脊从袋子里取出来，放在砧板上，拿起菜刀，然后停顿了一秒，调整了一下握刀的位置，落刀。第一刀很平稳，第二刀的厚度比第一刀差了大概一点五毫米，第三刀我调整了一下角度，把厚度压了回来。", "厨房里只有刀落在砧板上的声音，均匀，没有多余的停顿。", "我切完整条里脊，把肉丝收进碗里，加生抽、淀粉、一点点料酒，用手抓匀，放在旁边腌制。然后是青椒，去蒂，去籽，斜切成条。", "我尽量不去想门口有一双异色的眼睛正在看，因为一旦开始在意那个视线，我的手就会产生一种不该有的微颤——不是紧张，是“如果切得不好会被她记住”这个念头在作祟。", "锅烧热，倒油，晃匀，下肉丝。", "肉丝入锅的那一瞬间，油烟和声响一起升起来，我没有躲。我用锅铲迅速划散，肉丝从粉白色变成浅褐色，边缘微微焦，香气从锅底翻上来，和抽油烟机的风声混在一起。然后是青椒，入锅，翻炒，生抽沿锅边淋进去，滋的一声。", "我盯着锅里的颜色变化，等到青椒边缘开始出现焦色，关火，出锅，装盘。", "整个过程大概六分钟，中间没有看手机，没有停下来想下一步应该做什么，手比上一次顺了很多。", "我把盘子放在灶台上，侧过头，对门口说：“好了。”", "洛灵梦走过来，低头看了一眼那盘青椒肉丝，没有立刻评价，视线在肉丝的色泽和青椒的焦边上各停了一拍，然后抬起头：“肉丝，比上次，均匀。”", "“嗯，手顺了一点。”", "“青椒，焦边，比上次少。”", "“火候控制比上次好，翻得也快。”", "她点了点头，然后把视线移到旁边那袋金针菇上：“那个，怎么，处理？”", "“那个是昨天没计划的，”我说，“明天做汤的时候给你加进去。”", "她把这句话储存好，然后非常自然地补了一句：“明天，味增汤，加它。”", "“你确定？”", "“不确定，”她说，语气平静，“但，试一下，就知道。”", "我看了她一眼，没有反驳，把锅洗了，开始做番茄蛋汤。", "番茄切块，下锅炒出汁，加水，煮开，蛋液打散，沿着筷子淋进去，蛋花浮起来之后关火，加盐，撒葱花。这道菜比青椒肉丝少了很多需要关注的变量，做起来更从容。", "洛灵梦全程站在旁边，没有换位置，一直看完。", "等我把汤碗端上桌，她在餐桌边坐下，目光扫过那盘青椒肉丝和番茄蛋汤，沉默了两秒，然后用一种非常认真的语气开口：“今天，是，良吗？”", "我盛饭的动作停了一下。", "她在问我，用的是那个我昨天给她定的评级体系，她自己记得，并且在今天主动用它来问我。", "“等尝过再说，”我把饭放在她面前，“你的评分和我的评分，目前只差一次校准。”", "她拿起筷子，夹了一筷子青椒肉丝，放进嘴里，咀嚼，咽下，停顿。", "我看她，等她说话。", "她没有说“好吃”，而是说：“比昨天，的更好。”", "“在哪里？”", "“肉，更嫩，”她说，“味道，更进去。”", "她的判断和我自己的感知一致，所以我没有否认，也夹了一口。确实比昨天好——肉丝腌制的时间够了，火候也稳了，青椒的脆度保留得比上次完整，整体味道更干净，没有那种调料没有融合的生涩感。", "我把筷子放下，端起饭碗：“良，今天是良。”", "洛灵梦听到这个评价，低头看了看自己碗里的米饭，然后拿起筷子，安静地开始吃饭。吃到一半，她忽然停下来，用一种平淡的语气说：“明天，我的，味增汤，也要，到良。”", "这句话像是一个承诺，或者更像是一次目标更新。她说完，就继续低头认真地扒饭了。", "我没有回答她，因为我不知道该怎么回答。如果她说的是真的，那她明天早上会用一个量杯加一支温度计，把味增汤推进到我给的新评级里。如果她失败了，她会重新复盘，再来。而她大概率不会失败，因为她有把“每一次都会好一点”当作底层信念的固执。", "这个念头让我的筷子上停了一拍，我把它按下去，继续吃饭。", "桌子不大，两碗米饭，一荤一素一汤。傍晚的光从窗帘缝里漏进来最后一点，橘黄色的，落在她手臂旁边的桌面上。", "她把金针菇的袋子拿起来看了看，看了看上面的生产日期，确认了一下，然后放回购物袋里，抬头对我说：“明天，用它。”", "“知道了。”", "客厅很安静，只有筷子碰碗沿的清脆声响，混着屋外偶尔经过的车辆声和远处模糊的广播声。她吃得认真，咀嚼细致，偶尔停下来，像在想什么，然后继续吃。", "吃完最后一口饭，她把碗放下，用手背抹了一下嘴角，然后非常正式地转向我，说出了今晚的最后一句话。", "“零，绮一，明天，早饭，还有，午饭，我都会，负责的。”", "“午饭你什么时候——”", "“早上去，做完味增汤，顺带做便当。”", "“你是说，你要带两份便当去学校？”", "“对，”她点头，“你一份，我一份。”", "我看着她的眼睛，那双异色的瞳孔里没有犹豫，也没有邀功的意味，只有一种决定了就做的平静。", "“……你是哪根筋搭错了要开始做便当了。”", "“金针菇，”她说，“买了，就要用。我，不想浪费。”", "这个逻辑，我竟然找不到任何反驳的地方。", "“行吧，”我说，“随你。”", "她点了点头，端起空碗，走到水槽边，开始洗碗。我坐在餐桌边，看着她的背影在水槽前忙活了一会儿，然后起身，把剩下的菜收进冰箱。", "窗外的天色已经完全暗下来了。厨房的水声均匀地响着，偶尔她停下来，把冲干净的碗叠进沥水架，发出一声清脆的磕碰声。", "我靠在沙发背上，拿起手机，打开了一个菜谱软件——不是因为我有什么需要学的新菜，只是因为翻到了，随手点开看看。", "对，就是随手点开。", "我才不会告诉她，我刚才在想“她做便当的话，我一个人吃饭，会不会有点单调”这种白痴问题，完全没有。", "我站起来，走到水槽边，把自己的碗也放进去：“我来洗。”", "“为什么？”", "“因为晚饭是我做的，”我说，“分工明确，是这个家里的一项基础规则。”", "她看了一眼我塞进她手里的碗，想了一下，没有反驳，让开了一点位置，把水龙头让了出来。水声在两个人之间交替，没有对话，有一种不需要去填补的安静。", "外面的路灯亮着，光线从窗帘的缝隙里漏进来一道，落在地板上，像一个安静的角落标记。今晚的月亮大概不错，但此刻没有人有空去看。", "我把最后一个碗冲干净，放进沥水架，甩了甩手上的水，关灯。客厅暗下来，走廊尽头她房间的门缝里亮着一线光。", "“零，绮一，”声音从门缝里传出来，“明天，你会吃我做的便当吗？”", "“做了就吃。”", "“好。”", "门缝里的光还亮着，合上门的动作很轻，几乎没有声响。", "我站了两秒，走到自己房间门口，关上门，躺倒在床上，盯着天花板。明天她要做味增汤，还要做便当——一个连“买”是什么意思都不知道的三无少女，现在要同时管理早饭和午饭的生产线了。这个进度快得有点超出预期，但仔细一想，又觉得确实是她的风格：不犹豫，不后退，直接行动，把她看不懂的规则全部当作未掌握的知识点，逐个击破，然后重新编程。", "我在黑暗里翻了个身，闭上眼睛。", "明天早上的味增汤会是什么味道，我不知道。但她说明天会变得更好，我就姑且信一次。反正也不会比第一天更差——有了这句话当保底，我的大脑安心地进入了节电模式，为明天早上的未知挑战储备能量。"]}]}, {"id": "novel-weird", "title": "请别再让我的生活更奇怪了", "subtitle": "武术世家大小姐高考完跑去环游世界", "status": "一章完", "date": "2024 — ", "synopsis": "李慕凝，武术天赋最高的大小姐，被家族日复一日训练到想逃。高考后甩开父母，独自环球旅行。", "chapters": [{"title": "人设速写", "body": ["女一：李慕凝", "小时候被喝迷糊的老爹带着喝了一次酒之后就沉醉酒中滋味的武术世家大小姐，小时候是附近一片的孩子王，在自己的家族里也是历代武术天赋最高的人。但是正因如此也被家里寄予过分的期待，压迫着李慕凝日复一日的训练，一直灌输给她必须要振兴家族的愿望。 于高一到高三拿了数个青少年比赛的冠军，被称为武术未来之光的情况下，选择在高考后拿着钱环游世界旅游散心。 临走时仅仅让男主角送到了机场，给父母在桌案上用歪歪扭扭的毛笔字写下一段“仰天大笑出门去，我辈岂是蓬蒿人。” 预计于男主角大一左右回国在旅行期间感受一个人的冷静与孤独，期盼有人陪伴，但回归早期仍旧只认为男主角是个一起长大的弟弟，会喝着酒跟他抱怨外国酒不好喝，抱怨饭不好吃，说不会各国语言很麻烦也不能很尽兴的玩耍。 直到见到男主角和别人亲热时才意会到对男主角不只是朋友的感情，于是开始猛烈进攻。 女（？）二：赵瑾予 小时候和李慕凝还有男主玩的小男孩，生的清新秀气，从小就被人夸如果是女孩一定很漂亮。家庭不算幸福，父母相互嫌弃，即使从小就很认真听话也没有被父母爱过，父亲忙于工作和外遇少有回家，母亲偶尔回来也只是抱怨他没有男孩子气，直到十岁父母总算结束拖延着的婚姻，由奶奶照顾赵瑾予。十四岁时在网络上认识了一个姐姐教他女装，看着镜子里可爱的自己，赵瑾予产生了一种“要是我真的是女孩子就好了”的感觉。 而在十五岁时奶奶的过世加剧了这种感觉，赵瑾予没有回到父母任意一人身边，二者都构建了家庭，由于父母的工作都算得上稳定且富裕，赵瑾予自己租了个房子住，同时越来越过分的女装起来，并且对自己的性别产生了认知障碍，觉得自己应该是女生，却又为自己是生理男性却又拿不出社会男性该有的样子而自卑。 对于男主和李慕凝都有向往的情感，在性别认知产生障碍的时间里，李慕凝忙着参加比赛，在与男主的相处中对男主角产生爱慕，但同时又自卑于自己的情况，不敢和男主表白心意，认为男主配得上更好。 同时，在他逐渐雌堕的过程中，和女性越来越聊得来有了很多女性朋友，甚至开始向男主角介绍其中的优质股。"]}, {"title": "第一章 送别", "body": ["    第一章 送别 “别送了，真要登机了。” “真走啊。”白泉今天已经不知道说了多少次这话。 “那不然呢？”女子翻了个大大的白眼，“拜托，登机牌上写的一清二楚，姐们现在就是要逃离这破地儿了。从此姐们儿乐意吃啥吃啥，乐意咋玩咋玩，乐意喝多少喝多少。” “虽然说有毕业旅行这么个说法，但谁家好人高考完的毕业旅行是环球旅行啊，知道的以为你家是开武馆的，不知道还当你家是什么传说中的隐世大家族呢。”白泉扶了扶额，显然对女子这样不负责任地抽风乱跑相当头疼。 “嘿，你别说，你还真别说，就咱家里对咱的这训练强度，咱有的时候都怀疑咱会不会真是什么影响世界的古武世家大小姐，家里那老登非得让咱以武夺嫡，狠狠地振兴我们这郁郁不得志的一脉。”女子拨了拨丸子头下垂落的长发，洒脱不羁地说道。 白泉对女子丰富的想象力和旺盛的吐槽欲已经习以为常，只是同样对女子翻了翻白眼说道：“给你个杆儿你是真往上爬啊，那咱们大小姐咋放弃夺嫡，改摆烂冲刺外国了，啥词汇量啊，就环球旅行。” 女子把手放在鼻子前扇了扇，露出一副尴尬的神色，笑道：“哎呀哎呀，这不是想着去去这十八年的晦气么，感觉再待在这个环境里人真的要锈掉了。” 白泉并非不能理解女子这么大的怨气，毕竟女子的家人对她抱有了过分的期待，以至于她的训练量的确过分。 不过成绩也的确斐然就是了。 “那你也不至于跟家里一点交代都没有，就这么水灵灵地走掉吧。”白泉绞尽脑汁也最后只能干巴巴地说上这么一句。 女子白眼一翻，小嘴一撇，"]}]}];

const { useState, useEffect, useRef, useMemo } = React;

// ── 小工具 ──
function Reveal({ children, delay = 0 }) {
  const ref = useRef();
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setShown(true); io.disconnect(); }
    }, { threshold: 0.08 });
    io.observe(el); return () => io.disconnect();
  }, []);
  return (
    <div ref={ref} style={{ opacity: shown ? 1 : 0, transform: shown ? 'none' : 'translateY(18px)',
      transition: `opacity .7s ${delay}ms cubic-bezier(.22,1,.36,1), transform .7s ${delay}ms cubic-bezier(.22,1,.36,1)` }}>
      {children}
    </div>
  );
}

// ── NovelHubView (长篇章节目录) ──
function NovelHubView({ novelId, go }) {
  const n = NOVELS.find(x => x.id === novelId);
  if (!n) return null;
  return (
    <div className="novel-hub page-enter">
      <span className="read-back" onClick={() => go('novels')}>返回小说</span>
      <Reveal>
        <div className="novel-hero">
          <span className="label">长篇 · {n.status}</span>
          <h1>《{n.title}》</h1>
          <div className="sub">{n.subtitle}</div>
          <p className="syn">{n.synopsis}</p>
          <div className="meta">
            <span>{n.date}</span>
            <span>共 {n.chapters.length} 章</span>
          </div>
        </div>
        <div className="ch-list">
          {n.chapters.map((ch, i) => (
            <div key={i} className="ch" onClick={() => go('novel-chapter', { novel: novelId, ch: i })}>
              <span className="n">{String(i).padStart(2, '0')}</span>
              <span className="ct">{ch.title}</span>
            </div>
          ))}
        </div>
      </Reveal>
    </div>
  );
}

// ── NovelChapterView ──
function NovelChapterView({ novelId, chIdx, go }) {
  const n = NOVELS.find(x => x.id === novelId);
  if (!n) return null;
  const ch = n.chapters[chIdx];
  if (!ch) return null;
  return (
    <div className="read-page page-enter">
      <span className="read-back" onClick={() => go('novel-hub', { novel: novelId })}>返回 《{n.title}》</span>
      <Reveal>
        <div className="read-meta">
          <span className="kind">第 {String(chIdx).padStart(2, '0')} 章</span>
          <span>·</span>
          <span>{n.title}</span>
        </div>
        <h1 className="read-title">{ch.title}</h1>
        <span className="read-rule" />
        <div className="read-body">
          {ch.body.map((p, i) => <p key={i}>{p}</p>)}
        </div>
        <div className="chap-pager">
          <button onClick={() => chIdx > 0 && go('novel-chapter', { novel: novelId, ch: chIdx - 1 })} disabled={chIdx === 0}>
            ← 上一章
          </button>
          <button onClick={() => go('novel-hub', { novel: novelId })}>章节目录</button>
          <button onClick={() => chIdx < n.chapters.length - 1 && go('novel-chapter', { novel: novelId, ch: chIdx + 1 })}
            disabled={chIdx >= n.chapters.length - 1}>
            下一章 →
          </button>
        </div>
      </Reveal>
    </div>
  );
}

// ── EssaysView ──
function EssaysView({ go }) {
  return (
    <div className="wrap page-enter">
      <section className="sec" style={{ marginTop: 60 }}>
        <div className="sec-head">
          <span className="hand">随笔</span>
          <span className="en">ESSAYS</span>
          <Squiggle />
        </div>
        <div className="list-flat">
          {ESSAYS.map((e, i) => (
            <Reveal key={e.id} delay={i * 40}>
              <div className="row kind-sj" onClick={() => go('essay', { id: e.id })}>
                <span className="kind">— 随 —</span>
                <div>
                  <h4>{e.title}</h4>
                  <div className="sub">{e.sub}</div>
                </div>
                <span className="read">{e.reading}</span>
                <span className="date">{e.date}</span>
              </div>
            </Reveal>
          ))}
        </div>
      </section>

      <section className="sec">
        <div className="sec-head">
          <span className="hand">段子</span>
          <span className="en">BITS</span>
          <Squiggle />
        </div>
        <div className="list-flat">
          {BITS.map((b, i) => (
            <Reveal key={b.id} delay={i * 40}>
              <div className="row kind-dz" onClick={() => go('bit', { id: b.id })}>
                <span className="kind">— 段 —</span>
                <div>
                  <h4>{b.title}</h4>
                  <div className="sub">{b.sub}</div>
                </div>
                <span className="read">{b.reading}</span>
                <span className="date">{b.date}</span>
              </div>
            </Reveal>
          ))}
        </div>
      </section>
    </div>
  );
}

// ── EssayView (随笔/段子阅读) ──
function EssayView({ id, isBit, go }) {
  const arr = isBit ? BITS : ESSAYS;
  const e = arr.find(x => x.id === id);
  if (!e) return null;
  return (
    <div className="read-page page-enter">
      <span className="read-back" onClick={() => go('essays')}>返回</span>
      <Reveal>
        <div className="read-meta">
          <span className="kind">{isBit ? '— 段子 —' : '— 随笔 —'}</span>
          <span>{e.date}</span>
          <span>·</span>
          <span>{e.reading}</span>
        </div>
        <h1 className="read-title">{e.title}</h1>
        <div className="read-sub">{e.sub}</div>
        <span className="read-rule" />
        <div className="read-body">
          {e.body.map((p, i) => <p key={i}>{p}</p>)}
        </div>
      </Reveal>
    </div>
  );
}

// ── ProjectsView ──
function ProjectsView() {
  return (
    <div className="wrap page-enter">
      <section className="sec" style={{ marginTop: 60 }}>
        <div className="sec-head">
          <span className="hand">做过的项目</span>
          <span className="en">PROJECTS</span>
          <Squiggle />
        </div>
        <div className="proj-grid">
          {PROJECTS.map(p => (
            <Reveal key={p.id}>
              <div className="pcard" onClick={() => window.open(p.github, '_blank')}>
                <span className="stamp">{p.status}</span>
                <h3>{p.name}</h3>
                <div className="sub">{p.sub}</div>
                <p>{p.desc}</p>
                <div className="tags">{p.tags.map(t => <span key={t} className="tag">{t}</span>)}</div>
                <div style={{ marginTop: 18, fontFamily: "'Quicksand',sans-serif", fontSize: 12, color: 'var(--ink-soft)' }}>
                  {p.stack}
                </div>
              </div>
            </Reveal>
          ))}
        </div>
      </section>
    </div>
  );
}

// ── AboutView ──
function AboutView({ go }) {
  // count metrics
  const allChars = COLLECTIONS.reduce((sum, c) =>
    sum + c.pieces.reduce((s, p) => s + p.body.join('').length, 0), 0);
  const novelChars = NOVELS.reduce((s, n) =>
    s + n.chapters.reduce((ss, c) => ss + c.body.join('').length, 0), 0);
  const totalPieces = COLLECTIONS.reduce((s, c) => s + c.pieces.length, 0) + ESSAYS.length + BITS.length;
  const totalChapters = NOVELS.reduce((s, n) => s + n.chapters.length, 0);

  return (
    <div className="about-page page-enter">
      <Reveal>
        <h1>关于<span className="accent">我</span></h1>
        <p>
          <span className="hl">22 岁的学生</span>，一个每天在「明天再写」和「今晚得睡」之间反复横跳的人。
          写代码也写字，做的项目都跟 AI 沾点边。
        </p>
        <p>
          这个站起名「日暮途远」，是因为我喜欢那句老话「日暮途远，马瘦毛长」——
          天快黑了，路还很远，马又瘦，毛长得乱。听上去够狼狈，可我偏喜欢这股劲儿：
          再狼狈，马也还在往前走。这里就是这匹瘦马一路上掉下的脚印。
        </p>
        <p style={{ fontStyle: 'italic' }}>
          PS：站点是我和 Claude 一起搭的，文字全部出自我手。如果你看到错别字，那就是我的。
        </p>

        <div className="about-stats">
          <div className="about-stat"><div className="n">{totalPieces}</div><div className="l">中短篇 · 随笔</div></div>
          <div className="about-stat"><div className="n">{totalChapters}</div><div className="l">长篇章节</div></div>
          <div className="about-stat"><div className="n">{PROJECTS.length}</div><div className="l">真在做的项目</div></div>
          <div className="about-stat"><div className="n">{Math.round((allChars + novelChars) / 1000)}<small style={{fontSize:'.4em',marginLeft:4}}>k</small></div><div className="l">字</div></div>
        </div>

        <div className="about-links">
          <a href={SITE.github} target="_blank" rel="noopener">GitHub</a>
          <a className="line" href={'mailto:' + SITE.email}>Mail</a>
          <a className="line" onClick={(e) => { e.preventDefault(); go('novels'); }} href="#">看小说</a>
        </div>
      </Reveal>
    </div>
  );
}

// ── App / Router ──
function App() {
  const [route, setRoute] = useState({ view: 'home' });
  const go = (view, params = {}) => {
    setRoute({ view, ...params });
    window.scrollTo({ top: 0, behavior: 'instant' });
  };

  let content;
  switch (route.view) {
    case 'home':           content = <HomeView go={go} />; break;
    case 'novels':         content = <NovelsView go={go} />; break;
    case 'collection-piece': content = <CollectionPieceView colId={route.col} pieceId={route.piece} go={go} />; break;
    case 'novel-hub':      content = <NovelHubView novelId={route.novel} go={go} />; break;
    case 'novel-chapter':  content = <NovelChapterView novelId={route.novel} chIdx={route.ch} go={go} />; break;
    case 'essays':         content = <EssaysView go={go} />; break;
    case 'essay':          content = <EssayView id={route.id} isBit={false} go={go} />; break;
    case 'bit':            content = <EssayView id={route.id} isBit={true} go={go} />; break;
    case 'projects':       content = <ProjectsView />; break;
    case 'about':          content = <AboutView go={go} />; break;
    default:               content = <HomeView go={go} />;
  }

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <Nav route={route} go={go} />
      <main style={{ flex: 1 }} key={route.view + (route.col || '') + (route.piece || '') + (route.id || '') + (route.novel || '') + (route.ch ?? '')}>
        {content}
      </main>
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
